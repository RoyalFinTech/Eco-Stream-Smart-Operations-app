# nginx.conf — reverse proxy in front of the EcoStream API + static portals.
#
# This file is HTTP-only on purpose (port 80) so it works immediately with
# `docker-compose --profile with-nginx up`. For real HTTPS, the easiest path
# is Certbot's nginx plugin, which rewrites this file for you:
#
#   sudo apt-get install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.yourdomain.com -d admin.yourdomain.com -d portal.yourdomain.com
#
# Certbot will add the `listen 443 ssl` blocks and certificate paths
# automatically and set up auto-renewal — don't hand-write the SSL
# stanza yourself unless you have a specific reason to.

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name portal.yourdomain.com;
    root /usr/share/nginx/html/portal;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name admin.yourdomain.com;
    root /usr/share/nginx/html/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
