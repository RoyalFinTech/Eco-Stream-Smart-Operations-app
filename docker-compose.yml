# docker-compose.yml — local/production compose setup.
#
# Default (`docker-compose up`) runs just the API on its zero-dependency
# JSON datastore — no Postgres needed, matches how the app runs today.
#
# The `postgres` service is included and ready for when you complete the
# Prisma migration (see documentation/POSTGRES_MIGRATION.md) — start it with
# the `postgres` profile once the backend actually reads DATABASE_URL:
#   docker-compose --profile postgres up

services:
  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-120}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Uncomment once the Postgres migration (see documentation/POSTGRES_MIGRATION.md) is complete:
      # - DATABASE_URL=postgresql://ecostream:ecostream@postgres:5432/ecostream?schema=public
      # - STORAGE_PROVIDER=local
    volumes:
      - ecostream-database:/app/database
      - ecostream-uploads:/app/uploads
      - ecostream-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"] # only starts when you run: docker-compose --profile postgres up
    environment:
      - POSTGRES_USER=ecostream
      - POSTGRES_PASSWORD=ecostream
      - POSTGRES_DB=ecostream
    ports:
      - "5432:5432"
    volumes:
      - ecostream-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecostream"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    profiles: ["with-nginx"] # optional reverse proxy — see nginx.conf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client-portal:/usr/share/nginx/html/portal:ro
      - ./admin-portal:/usr/share/nginx/html/admin:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ecostream-database:
  ecostream-uploads:
  ecostream-logs:
  ecostream-postgres-data: