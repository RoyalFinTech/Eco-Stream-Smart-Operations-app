<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoStream API Docs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
<style>body{margin:0;background:#fafafa;}</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script>
  // Loads openapi.yaml from the same folder. Swagger UI is pulled from a CDN
  // (no npm package installed — this sandbox has no registry access, but a
  // CDN <script> tag works fine in any real browser with internet access).
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: "./openapi.yaml",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
    });
  };
</script>
</body>
</html>
