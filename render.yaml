services:
  - type: web
    name: ecostream
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_MAX
        value: "120"
