<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoStream — Admin Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design tokens shared with the Client Portal — see that file's CSS
   header for rationale (palette, type pairing, signature gauge). */
:root{
  --green:#0B8F4D; --green-dark:#064D28; --green-deepest:#052E18;
  --blue:#1565C0; --blue-light:#E8F2FC;
  --sand:#F6F8F5; --sand-deep:#ECF1EC;
  --charcoal:#16211B; --charcoal-soft:#3A4A42;
  --amber:#F0932B; --amber-light:#FDF1E4;
  --red:#D6534A; --red-light:#FBEAE8;
  --purple:#7B4FC9; --purple-light:#EFE7FA;
  --card:#FFFFFF; --border:#E1E8E3; --text:#182620; --text-muted:#5B6E64; --text-faint:#8FA298;
  --glass:rgba(255,255,255,.66); --glass-border:rgba(255,255,255,.5);
  --radius:18px; --radius-sm:12px;
  --shadow-soft:0 8px 30px rgba(10,40,25,.08);
  --shadow-lift:0 16px 44px rgba(10,40,25,.14);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
html[data-theme="dark"]{
  --sand:#0D1712; --sand-deep:#0A130F;
  --card:#152019; --border:#25342B; --text:#EAF2EC; --text-muted:#9CB0A5; --text-faint:#5F756A;
  --glass:rgba(21,32,25,.6); --glass-border:rgba(255,255,255,.08);
  --blue-light:#132A44; --amber-light:#3A2A10; --red-light:#3A1414; --purple-light:#241a38;
  --shadow-soft:0 8px 30px rgba(0,0,0,.35); --shadow-lift:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:var(--font-body); background:var(--sand); color:var(--text); transition:background .25s ease,color .25s ease; -webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:var(--font-display);}
button,input,select,textarea{font-family:inherit; font-size:14px;}
button{cursor:pointer;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
table{border-collapse:collapse; width:100%;}
th,td{text-align:left; padding:10px 12px; font-size:13px;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); border-bottom:1.5px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--sand-deep);}

@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
.view{animation:fadeUp .35s ease both;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:12px; border:1.5px solid transparent; font-weight:600; font-size:14px; transition:transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 6px 18px rgba(11,143,77,.28);}
.btn-primary:hover{background:var(--green-dark);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--green); color:var(--green);}
.btn-danger{background:var(--red); color:#fff;}
.btn-ghost{background:rgba(255,255,255,.12); color:#fff; border:none;}
.btn-sm{padding:7px 14px; font-size:12.5px; border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55; cursor:not-allowed;}

.field{margin-bottom:16px; text-align:left;}
 .secret-field{position:relative;}
 .secret-field input{padding-right:48px!important;}
 .secret-toggle{position:absolute;right:8px;bottom:7px;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;}
 .secret-toggle:hover,.secret-toggle.active{background:var(--sand-deep);color:var(--blue);}
.field label{display:block; font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--card); color:var(--text); transition:border-color .15s ease, box-shadow .15s ease;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(11,143,77,.12);}
.field textarea{min-height:96px; resize:vertical;}
.field-hint{color:var(--text-faint); font-size:12px; margin-top:5px;}

.glass{background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border);}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-soft); transition:transform .18s ease, box-shadow .18s ease;}
.card-hover:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift);}
.card-pad{padding:20px;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; letter-spacing:.02em; padding:4px 11px; border-radius:99px; text-transform:uppercase;}
.badge-green{background:#E4F5EC; color:var(--green-dark);}
.badge-blue{background:var(--blue-light); color:var(--blue);}
.badge-amber{background:var(--amber-light); color:var(--amber);}
.badge-red{background:var(--red-light); color:var(--red);}
.badge-purple{background:var(--purple-light); color:var(--purple);}
.badge-grey{background:var(--sand-deep); color:var(--text-muted);}
html[data-theme="dark"] .badge-green{background:#0F3323;}

.gauge{position:relative; width:84px; height:84px; flex-shrink:0;}
.gauge svg{transform:rotate(-90deg);}
.gauge circle{fill:none; stroke-width:8;}
.gauge .track{stroke:var(--sand-deep);}
.gauge .fill{stroke:var(--blue); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.gauge .fill.complete{stroke:var(--green);}
.gauge-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge-label b{font-size:16px; line-height:1;}
.gauge-label span{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}

#toast-root{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--charcoal); color:#fff; padding:12px 20px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:fadeUp .25s ease;}
.toast.error{background:var(--red);}
.error-card{display:flex;gap:12px;padding:14px;border-radius:15px;background:var(--red-light);border:1px solid #F0C1BD;color:var(--text);line-height:1.45;}
.error-card .error-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#fff;color:var(--red);font-size:19px;flex:0 0 auto;}
.error-card h4{font-size:14px;margin-bottom:3px;}
.error-card p{font-size:12px;color:var(--text-muted);}
.toast.success{background:var(--green-dark);}

.modal-overlay{position:fixed; inset:0; background:rgba(10,20,15,.55); backdrop-filter:blur(3px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .2s ease;}
.modal{background:var(--card); border-radius:20px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lift); animation:fadeUp .25s ease;}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-body{padding:22px;}
.modal-footer{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

.auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(circle at 20% 15%, var(--green-dark), var(--green-deepest) 60%);}
.auth-box{width:100%; max-width:420px;}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; color:#fff; text-align:center;}
.auth-logo .mark{width:60px; height:60px; border-radius:16px; background:linear-gradient(135deg,var(--green),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:28px;}
.auth-logo h1{font-size:24px; letter-spacing:.02em;}
.auth-logo p{font-size:12px; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.12em; font-weight:700;}
.auth-card{background:#fff; border-radius:20px; padding:26px; box-shadow:0 30px 70px rgba(0,0,0,.35);}
.auth-foot{text-align:center; margin-top:16px; color:rgba(255,255,255,.5); font-size:12px;}
.auth-link{background:none; border:none; text-decoration:underline; cursor:pointer; font-size:13px;}

.app-shell{min-height:100vh; display:flex;}
.sidebar{width:236px; background:var(--charcoal); color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:200;}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand .mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--green),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:15px;}
.sidebar .brand b{font-size:14px;}
.sidebar .brand span{display:block; font-size:9px; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.1em;}
.nav-list{flex:1; overflow-y:auto; padding:10px 10px;}
.nav-group-label{font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.32); padding:14px 12px 6px;}
.nav-item{display:flex; align-items:center; gap:11px; width:100%; padding:9.5px 12px; border-radius:10px; background:transparent; border:none; color:rgba(255,255,255,.62); font-size:13px; font-weight:600; margin-bottom:1px; text-align:left; transition:background .15s ease, color .15s ease;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(135deg, var(--green), var(--green-dark)); color:#fff;}
.nav-item .ic{width:16px; text-align:center; font-size:14px;}
.sidebar-foot{padding:12px; border-top:1px solid rgba(255,255,255,.08);}

.main{flex:1; margin-left:236px; display:flex; flex-direction:column; min-height:100vh;}
.topbar{position:sticky; top:0; z-index:150; display:flex; align-items:center; gap:14px; padding:14px 28px; background:var(--glass); backdrop-filter:blur(14px); border-bottom:1px solid var(--border);}
.topbar h2{font-size:18px;}
.topbar .spacer{flex:1;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:16px; position:relative; color:var(--text);}
.icon-btn .dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--red); border:2px solid var(--card);}
.content{padding:26px 28px 90px; flex:1;}
.hamburger{display:none;}

@media (max-width: 960px){
  .sidebar{transform:translateX(-100%); transition:transform .25s ease; width:250px;}
  .sidebar.open{transform:translateX(0); box-shadow:20px 0 50px rgba(0,0,0,.3);}
  .main{margin-left:0;}
  .hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card); font-size:18px;}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190;}
  .sidebar-scrim.show{display:block;}
  .content{padding:18px 16px 100px;}
  .topbar{padding:12px 16px;}
}

.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:900px){ .grid-3,.grid-4,.grid-5{grid-template-columns:repeat(2,1fr);} }
@media (max-width:600px){ .grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;} }
.stat-card{padding:18px; border-radius:16px; background:var(--card); border:1px solid var(--border);}
.stat-card .num{font-family:var(--font-display); font-size:24px; font-weight:700;}
.stat-card .lbl{font-size:11.5px; color:var(--text-muted); margin-top:4px;}
.empty{text-align:center; padding:50px 20px; color:var(--text-muted);}
.empty .ic{font-size:38px; margin-bottom:10px;}
.section-title{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:var(--sand-deep); font-size:12.5px; font-weight:600; border:1.5px solid transparent; cursor:pointer;}
.chip.active{background:var(--green); color:#fff;}
.list-item{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.avatar{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.hero-band{background:linear-gradient(120deg, var(--green-dark), var(--green) 60%, var(--blue)); border-radius:22px; padding:24px; color:#fff; position:relative; overflow:hidden;}
.hero-band::after{content:""; position:absolute; right:-40px; bottom:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);}
.tag-input{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.skeleton{background:linear-gradient(90deg, var(--sand-deep) 25%, var(--border) 37%, var(--sand-deep) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}
.bar-chart{display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px;}
.bar-chart .bar{flex:1; background:linear-gradient(180deg,var(--blue),var(--green)); border-radius:6px 6px 0 0; position:relative; min-height:3px; transition:height .6s cubic-bezier(.4,0,.2,1);}
.bar-chart .bar span{position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--text-muted); white-space:nowrap;}
.bar-chart .bar-label{position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--text-faint); white-space:nowrap;}
.table-wrap{overflow-x:auto;}
.action-btn{background:none; border:none; padding:6px 8px; border-radius:8px; font-size:14px; color:var(--text-muted);}
.action-btn:hover{background:var(--sand-deep); color:var(--text);}
.role-matrix td, .role-matrix th{text-align:center;}
.role-matrix td:first-child, .role-matrix th:first-child{text-align:left;}
.tabs-row{display:flex; gap:6px; margin-bottom:18px; overflow-x:auto;}
.phone-control{display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:11px;overflow:hidden;background:var(--card);}
.phone-control:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(11,143,77,.12);}
.phone-country{display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--sand-deep);font-weight:800;font-size:12px;color:var(--text-muted);white-space:nowrap;border-right:1px solid var(--border);}
.phone-control input{border:0!important;box-shadow:none!important;border-radius:0!important;flex:1;min-width:0;}
.auth-foot{line-height:1.7;}
.auth-foot span{color:rgba(255,255,255,.78);font-weight:700;}
.auth-security{margin-top:14px;padding:15px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);color:#fff;text-align:center;}
.auth-security-title{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;}
.auth-security-copy{font-size:11px;color:rgba(255,255,255,.52);margin:5px 0 10px;line-height:1.5;}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;border-top:1px solid var(--border);color:var(--text-faint);font-size:11px;background:var(--card);}
.site-footer span:last-child{font-weight:800;color:var(--green);}
@media(max-width:700px){.site-footer{padding:14px 16px;flex-direction:column;text-align:center;}}


/* === EcoStream Premium Operations UI v2 === */
:root{
  --premium-navy:#071D2B; --premium-ink:#0B1720; --premium-mint:#10B981;
  --premium-cyan:#22D3EE; --premium-blue:#2563EB; --premium-violet:#7C3AED;
  --premium-orange:#F59E0B; --premium-line:rgba(15,42,55,.10);
}
body{background:radial-gradient(circle at 15% -10%,rgba(16,185,129,.10),transparent 28%),radial-gradient(circle at 100% 0%,rgba(37,99,235,.08),transparent 30%),var(--sand); }
.app-shell{background:transparent;}
.sidebar{background:linear-gradient(180deg,#071D2B 0%,#092B2A 55%,#063D2B 100%);border-right:0;box-shadow:18px 0 50px rgba(2,18,28,.16);padding:18px 14px;}
.sidebar .brand{padding:8px 10px 22px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:14px;}
.sidebar .brand b,.sidebar .brand span{color:#fff;}
.sidebar .nav-group-label{color:rgba(255,255,255,.42);font-size:10px;letter-spacing:.14em;margin:18px 10px 7px;}
.nav-item{color:rgba(255,255,255,.72);border:1px solid transparent;border-radius:13px;margin:3px 0;padding:11px 12px;transition:.2s;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px);}
.nav-item.active{background:linear-gradient(135deg,#0B8F4D,#10B981);color:#fff;box-shadow:0 9px 24px rgba(16,185,129,.22);}
.nav-item .ic{width:28px;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.09);padding-top:14px;}
.sidebar-foot .btn{color:#fff;border-color:rgba(255,255,255,.15);}
.main{min-width:0;}
.topbar{height:76px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--premium-line);padding:0 26px;position:sticky;top:0;z-index:20;}
.topbar h2{font-family:var(--font-body);font-weight:800;letter-spacing:-.03em;}
.hamburger{border:1px solid var(--border);background:var(--card);border-radius:13px;box-shadow:var(--shadow-soft);}
.content{max-width:1500px;margin:0 auto;padding:26px 30px 40px;}
.admin-hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 30px;background:linear-gradient(135deg,#071D2B 0%,#0A4C39 58%,#0B8F4D 100%);color:#fff;box-shadow:0 22px 55px rgba(4,50,35,.18);margin-bottom:20px;}
.admin-hero:after{content:"";position:absolute;width:260px;height:260px;border:42px solid rgba(255,255,255,.08);border-radius:50%;right:-65px;top:-100px;}
.admin-hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:#A7F3D0;}
.admin-hero h1{font-family:var(--font-display);font-size:32px;line-height:1.1;margin:5px 0 8px;}
.admin-hero p{max-width:650px;color:rgba(255,255,255,.78);font-size:13px;}
.admin-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.admin-quick .btn{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.09);backdrop-filter:blur(8px);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px;}
.kpi-card{position:relative;overflow:hidden;border:1px solid var(--premium-line);background:rgba(255,255,255,.88);border-radius:20px;padding:18px;box-shadow:0 12px 32px rgba(9,35,25,.07);transition:.22s;}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(9,35,25,.12);}
.kpi-card .kpi-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--kpi-bg,#E8F7F0);font-size:19px;margin-bottom:15px;}
.kpi-card .kpi-value{font-size:27px;font-weight:850;letter-spacing:-.04em;}
.kpi-card .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:700;margin-top:3px;}
.kpi-card .kpi-meta{font-size:11px;color:var(--green);margin-top:10px;font-weight:700;}
.ops-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:18px;}
.ops-card{background:rgba(255,255,255,.9);border:1px solid var(--premium-line);border-radius:22px;box-shadow:var(--shadow-soft);overflow:hidden;}
.ops-card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--premium-line);}
.ops-card-head h3{font-family:var(--font-body);font-size:14px;font-weight:800;}
.ops-card-body{padding:18px 20px;}

<body>
<div id="toast-root"></div>
<div id="app"></div>
<script>
/* ============================================================
   ECOSTREAM ADMIN OPERATIONS PORTAL — application logic
   Same architecture as the Client Portal: vanilla JS, template-
   string views, one delegated click/submit handler. Staff/admin
   roles only — the API rejects client tokens on every route here.
   ============================================================ */
(function(){
"use strict";

const CONFIG = (() => {
  const stored = localStorage.getItem("eco_api_base");
  const browserOrigin = (location.protocol === "http:" || location.protocol === "https:") ? location.origin : "";
  const isLocalBrowser = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  const storedIsLocal = !!stored && (stored.startsWith("http://localhost:") || stored.startsWith("https://localhost:") || stored.startsWith("http://127.0.0.1:") || stored.startsWith("https://127.0.0.1:"));
  // Production is same-origin. Never trust a stale persisted API URL there;
  // only local development may override the API base.
  return { apiBase: isLocalBrowser && stored ? stored : (browserOrigin || "http://localhost:4000") };
})();
const state = {
  token: localStorage.getItem("eco_token") || null,
  refreshToken: localStorage.getItem("eco_refresh_token") || null,
  user: JSON.parse(localStorage.getItem("eco_user") || "null"),
  view: "dashboard",
  authMode: "login",
  cache: {},
  chatPoll: null,
  activeChatClient: null,
};
const app = document.getElementById("app");

/* ---------- helpers (shared pattern with client portal) ---------- */
function gmd(n){ return "GMD " + Number(n||0).toLocaleString(); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }catch{ return d; } }
function fmtDateTime(d){ try{ return new Date(d).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch{ return d; } }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function toast(msg, type=""){
  const root = document.getElementById("toast-root");
  const t = document.createElement("div");
  t.className = "toast " + type; t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 2600);
}


async function getPasskeyClient(){
  const cfg=await api("/api/config/public");
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey) throw new Error("Supabase public Auth configuration is unavailable.");
  const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm");
  return createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{experimental:{passkey:true},persistSession:false,autoRefreshToken:false}});
}
async function signInWithPasskey(){
  try{
    if(!window.PublicKeyCredential) throw new Error("This device or browser does not support passkeys.");
    const client=await getPasskeyClient();
    const {data,error}=await client.auth.signInWithPasskey();
    if(error) throw error;
    const session=data.session;
    state.token=session.access_token; state.refreshToken=session.refresh_token;
    const res=await api("/api/auth/profile");
    if(!["staff","admin"].includes(res.user.role)){ logout(false); throw new Error("This account is not authorized for the staff portal."); }
    setAuth(session.access_token,session.refresh_token,res.user); state.view="dashboard"; toast("Biometric staff sign-in successful","success"); render();
  }catch(err){ toast(err.message||"Biometric sign-in was not completed.","error"); }
}
async function registerPasskey(){
  try{ const client=await getPasskeyClient(); const {error}=await client.auth.registerPasskey(); if(error) throw error; toast("This device is now registered for staff biometric sign-in.","success"); }
  catch(err){ toast(err.message||"Could not register this device.","error"); }
}

async function api(path, opts={}){
  const headers = { "Content-Type":"application/json", ...(opts.headers||{}) };
  const publicAuthPath = ["/api/auth/login","/api/auth/admin-login","/api/auth/refresh"].includes(path);
  if(state.token && !publicAuthPath) headers["Authorization"] = "Bearer " + state.token;
  let res;
  try{ res = await fetch(CONFIG.apiBase + path, { ...opts, headers }); }
  catch(e){ toast("Can't reach the EcoStream server at " + CONFIG.apiBase + ". Is it running?", "error"); throw e; }
  let data = {};
  try{ data = await res.json(); }catch{}

  if(res.status === 401 && !opts._retried && state.refreshToken && !["/api/auth/refresh","/api/auth/login","/api/auth/admin-login"].includes(path)){
    const refreshed = await trySilentRefresh();
    if(refreshed) return api(path, { ...opts, _retried: true });
  }
  if(res.status === 401 && !["/api/auth/login","/api/auth/admin-login"].includes(path)){
    logout(false); showFriendlyErrorCard("Your session has ended","For your security, please sign in again."); throw new Error("unauthorized");
  }
  if(res.status === 401 && ["/api/auth/login","/api/auth/admin-login"].includes(path)){
    showFriendlyErrorCard("Administrator sign-in failed",data.error||"The credentials could not be verified. Please check them and try again."); throw new Error(data.error||"unauthorized");
  }
  if(res.status === 403 && !["/api/auth/login","/api/auth/admin-login"].includes(path)){ showFriendlyErrorCard("Access denied",data.error||"You don't have permission for this action."); throw new Error("forbidden"); }
  if(!res.ok){ showFriendlyErrorCard("Request could not be completed",data.error||"Something went wrong. Please try again."); throw new Error(data.error||String(res.status)); }
  return data;
}
async function trySilentRefresh(){
  try{
    const res = await fetch(CONFIG.apiBase + "/api/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refreshToken: state.refreshToken }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    state.token = data.token; state.refreshToken = data.refreshToken;
    localStorage.setItem("eco_token", data.token);
    localStorage.setItem("eco_refresh_token", data.refreshToken);
    return true;
  }catch{ return false; }
}
function setAuth(token, refreshToken, user){
  state.token = token; state.refreshToken = refreshToken; state.user = user;
  localStorage.setItem("eco_token", token);
  if(refreshToken) localStorage.setItem("eco_refresh_token", refreshToken);
  localStorage.setItem("eco_user", JSON.stringify(user));
}
async function logout(redirect=true){
  const accessToken = state.token;
  const refreshToken = state.refreshToken;
  // Revoke the current Supabase session before clearing local credentials.
  if(accessToken){
    try{
      await fetch(CONFIG.apiBase + "/api/auth/logout", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
        body:JSON.stringify({refreshToken})
      });
    }catch{}
  }
  state.token=null; state.refreshToken=null; state.user=null;
  localStorage.removeItem("eco_token"); localStorage.removeItem("eco_refresh_token"); localStorage.removeItem("eco_user");
  if(state.chatPoll) clearInterval(state.chatPoll);
  state.authMode="login";
  if(redirect){ state.view="dashboard"; render(); }
}
function initTheme(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("eco_theme")||"light"); }
function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light":"dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("eco_theme", next); render();
}
function gauge(depth,total,size=84){
  const pct = total>0?Math.min(100,Math.round(depth/total*100)):0;
  const r=36,c=2*Math.PI*r, offset=c-(pct/100)*c, complete=pct>=100;
  return `<div class="gauge" style="width:${size}px;height:${size}px;"><svg width="${size}" height="${size}" viewBox="0 0 84 84">
    <circle class="track" cx="42" cy="42" r="${r}"></circle>
    <circle class="fill ${complete?'complete':''}" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
  </svg><div class="gauge-label"><b>${pct}%</b><span>${depth}/${total}m</span></div></div>`;
}
function statusBadge(status){
  const map = {
    pending:["badge-amber","Pending"], approved:["badge-blue","Approved"], ongoing:["badge-blue","Ongoing"],
    "in-progress":["badge-blue","In Progress"], completed:["badge-green","Completed"], rejected:["badge-red","Rejected"],
    paid:["badge-green","Paid"], open:["badge-amber","Open"], resolved:["badge-green","Resolved"],
    suspended:["badge-red","Suspended"], active:["badge-green","Active"], maintenance:["badge-amber","Maintenance"],
  };
  const [cls,label] = map[status] || ["badge-grey", status||"—"];
  return `<span class="badge ${cls}">${label}</span>`;
}
function barChart(data, valueKey, labelKey, colorVar){
  const max = Math.max(1, ...data.map(d=>d[valueKey]));
  return `<div class="bar-chart">${data.map(d=>{
    const h = Math.round(d[valueKey]/max*100);
    return `<div class="bar" style="height:${h}%;"><span>${typeof d[valueKey]==="number"&&d[valueKey]>999?Math.round(d[valueKey]/1000)+"k":d[valueKey]}</span><div class="bar-label">${esc(d[labelKey])}</div></div>`;
  }).join("")}</div>`;
}

/* ============================================================
   AUTH VIEWS
   ============================================================ */
function renderAuth(){
  app.innerHTML = `
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="mark" style="background:#fff;padding:4px;"><img src="assets/ecostream-logo.svg" alt="EcoStream" style="width:100%;height:100%;object-fit:contain;"></div>
        <h1>EcoStream</h1><p>Admin Operations</p>
      </div>
      <div class="auth-security staff-only">
        <div class="auth-security-title">🛡️ RESTRICTED STAFF ACCESS</div>
        <div class="auth-security-copy">Authorized EcoStream staff and administrators only. All access is monitored and may be audited.</div>
      </div>
      <div class="auth-card">
        <form data-form="login">
          <div class="field"><label>Administrator Email</label>
            <input type="email" name="email" required autocomplete="username" placeholder="Administrator email">
          </div>
          <div class="field"><label>Administrator Password</label><input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></div>
          <button class="btn btn-primary btn-block" type="submit">🛡️ Secure Administrator Sign In</button>
          <button class="btn btn-outline btn-block" style="margin-top:10px;" type="button" data-action="passkey-login">🔐 Use Phone Biometrics / Passkey</button>
        </form>
      </div>
      <div class="auth-foot">🛡️ Restricted Access · Authorized EcoStream Staff &amp; Administrators Only<br><span>Powered by Royal Fintech</span></div>
    </div>
  </div>`;
}


/* ============================================================
   APP SHELL
   ============================================================ */
const NAV = [
  ["OVERVIEW", null],
  ["dashboard","📊","Dashboard"],
  ["OPERATIONS", null],
  ["clients","🧑‍🤝‍🧑","Clients"],
  ["projects","🗺️","Projects"],
  ["PEOPLE & ASSETS", null],
  ["staff","👷","Staff"],
  ["equipment","🚜","Equipment"],
  ["FINANCE", null],
  ["finance","💰","Finance & Reports"],
  ["ENGAGEMENT", null],
  ["tickets","🎫","Support Tickets"],
  ["chat","💬","Client Chat"],
  ["notifications","🔔","Notifications"],
  ["SYSTEM", null],
  ["cms","📝","Site Content"],
  ["roles","🔐","Roles & Permissions"],
  ["audit","📜","Audit Logs"],
  ["settings","⚙️","Settings"],
];

function renderShell(innerHtml, title){
  const theme = document.documentElement.getAttribute("data-theme");
  app.innerHTML = `
  <div class="app-shell">
    <div class="sidebar-scrim" data-action="close-sidebar"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="mark" style="background:#fff;padding:4px;"><img src="assets/ecostream-logo.svg" alt="EcoStream" style="width:100%;height:100%;object-fit:contain;"></div><div><b>EcoStream</b><span>Admin Operations</span></div></div>
      <nav class="nav-list">
        ${NAV.map(([id,ic,label])=> ic===null ? `<div class="nav-group-label">${id}</div>` :
          `<button class="nav-item ${state.view===id?'active':''}" data-action="nav" data-view="${id}"><span class="ic">${ic}</span>${label}</button>`).join("")}
      </nav>
      <div class="sidebar-foot"><button class="btn btn-ghost btn-block" data-action="logout">🚪 Sign Out</button></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="hamburger" data-action="toggle-sidebar">☰</button>
        <h2>${title}</h2>
        <div class="spacer"></div>
        <button class="icon-btn" data-action="toggle-theme" title="Toggle dark mode">${theme==="dark"?"☀️":"🌙"}</button>
        <button class="icon-btn" data-action="nav" data-view="notifications" title="Notifications">🔔${state.cache.unreadCount?'<span class="dot"></span>':''}</button>
        <div class="avatar">${initials(state.user.name)}</div>
      </div>
      <div class="content view" id="view-root">${innerHtml}</div>
      <footer class="site-footer"><span>EcoStream Ltd · +220 380 6666</span><span>Powered by Royal Fintech</span></footer>
    </div>
  </div>`;
}
function loadingSkeleton(){ return `<div class="grid grid-4">${[1,2,3,4].map(()=>`<div class="skeleton" style="height:90px;"></div>`).join("")}</div>`; }
function errorState(msg){ return `<div class="empty"><div class="ic">⚠️</div>${esc(msg)}<br><button class="btn btn-outline" style="margin-top:14px;" data-action="reload">Try again</button></div>`; }

/* ============================================================
   DASHBOARD
   ============================================================ */
async function loadDashboard(){
  renderShell(loadingSkeleton(), "Dashboard");
  try{
    const [stats, notifRes, auditRes] = await Promise.all([
      api("/api/dashboard/stats"), api("/api/notifications"), api("/api/audit-logs").catch(()=>({logs:[]}))
    ]);
    state.cache.unreadCount = notifRes.notifications.filter(n=>!n.read && !n.userId).length;
    renderShell(dashboardHtml(stats, auditRes.logs.slice(0,6)), "Dashboard");
  }catch(e){ renderShell(errorState("Couldn't load dashboard stats."), "Dashboard"); }
}
function dashboardHtml(s, recentActivity=[]){
  const ACTIVITY_ICON = { login:"🔑", register:"🆕", login_failed:"⚠️", account_locked:"🔒", client_status_change:"👤", client_deleted:"🗑️", cms_updated:"📝", password_reset:"🔁", email_verified:"✅" };
  const pending = s.projects.pending || 0;
  const openTickets = s.tickets.open || 0;
  const active = s.projects.active || 0;
  const equipmentPct = s.equipment.total ? Math.round((s.equipment.active/s.equipment.total)*100) : 0;
  return `
  <section class="admin-hero">
    <div class="eyebrow">EcoStream Operations Centre</div>
    <h1>Good day, Administrator 👋</h1>
    <p>One command centre for drilling operations, clients, applications, finance, support, CMS and operational intelligence.</p>
    <div class="admin-quick">
      <button class="btn btn-ghost" data-action="nav" data-view="projects">📋 Review Applications</button>
      <button class="btn btn-ghost" data-action="nav" data-view="clients">👥 Open CRM</button>
      <button class="btn btn-ghost" data-action="nav" data-view="cms">✦ Manage CMS</button>
      <button class="btn btn-ghost" data-action="nav" data-view="audit">🛡️ Audit Trail</button>
    </div>
  </section>

  <section class="kpi-grid">
    <div class="kpi-card"><div class="kpi-icon" style="--kpi-bg:#E8F7F0">💧</div><div class="kpi-value">${active}</div><div class="kpi-label">Active Projects</div><div class="kpi-meta">Live field operations</div></div>
    <div class="kpi-card"><div class="kpi-icon" style="--kpi-bg:#FFF4E5">📋</div><div class="kpi-value">${pending}</div><div class="kpi-label">Applications</div><div class="kpi-meta">${pending ? "Needs review" : "Queue is clear"}</div></div>
    <div class="kpi-card"><div class="kpi-icon" style="--kpi-bg:#EEF2FF">👥</div><div class="kpi-value">${s.clients.total}</div><div class="kpi-label">CRM Clients</div><div class="kpi-meta">Registered customers</div></div>
    <div class="kpi-card"><div class="kpi-icon" style="--kpi-bg:#F3EAFE">💰</div><div class="kpi-value">${gmd(s.revenue)}</div><div class="kpi-label">Revenue</div><div class="kpi-meta">Profit ${gmd(s.profit)}</div></div>
  </section>

  <div class="ops-grid">
    <section class="ops-card">
      <div class="ops-card-head"><h3>Operations overview</h3><span class="status-badge status-active">● Live</span></div>
      <div class="ops-card-body">
        <div class="grid grid-3">
          <div class="stat-card"><div class="num">${s.projects.completed}</div><div class="lbl">Completed</div></div>
          <div class="stat-card"><div class="num">${s.staff.total}</div><div class="lbl">Staff</div></div>
          <div class="stat-card"><div class="num">${equipmentPct}%</div><div class="lbl">Equipment Ready</div></div>
        </div>
        <div class="section-title" style="margin-top:22px;">Project pipeline</div>
        ${barChart([{l:"Pending",v:pending},{l:"Active",v:active},{l:"Completed",v:s.projects.completed}].map(x=>({v:x.v,l:x.l})),"v","l")}
      </div>
    </section>
    <section class="ops-card">
      <div class="ops-card-head"><h3>Operational intelligence</h3></div>
      <div class="ops-card-body">
        <div class="insight-card">
          <span class="ai-badge">SMART INSIGHTS</span>
          <h3>${pending ? `You have ${pending} application${pending===1?"":"s"} waiting for review.` : "Operations are currently clear."}</h3>
          <p>${openTickets ? `${openTickets} support ticket${openTickets===1?"":"s"} need attention. ` : "No open support tickets. "}Equipment readiness is ${equipmentPct}% based on the current fleet records.</p>
          <button class="btn btn-ghost" style="margin-top:14px;color:#fff;border-color:rgba(255,255,255,.2);" data-action="nav" data-view="${openTickets ? "tickets" : "projects"}">Open priority queue →</button>
        </div>
      </div>
    </section>
  </div>

  <div class="section-title" style="margin-top:22px;">Command centre</div>
  <div class="module-grid">
    <div class="module-card" data-action="nav" data-view="projects"><div class="module-icon">📋</div><b>Applications</b><span>Review borehole requests and project pipeline.</span></div>
    <div class="module-card" data-action="nav" data-view="clients"><div class="module-icon">👥</div><b>CRM</b><span>Clients, profiles and customer relationships.</span></div>
    <div class="module-card" data-action="nav" data-view="cms"><div class="module-icon">📝</div><b>CMS</b><span>Control website content and digital presence.</span></div>
    <div class="module-card" data-action="nav" data-view="finance"><div class="module-icon">📈</div><b>Reports</b><span>Revenue, expenses and financial operations.</span></div>
    <div class="module-card" data-action="nav" data-view="equipment"><div class="module-icon">🚜</div><b>Fleet</b><span>Equipment readiness and asset tracking.</span></div>
    <div class="module-card" data-action="nav" data-view="tickets"><div class="module-icon">🎫</div><b>Support</b><span>Resolve customer issues and service tickets.</span></div>
    <div class="module-card" data-action="nav" data-view="chat"><div class="module-icon">💬</div><b>Client Chat</b><span>Communicate with customers in real time.</span></div>
    <div class="module-card" data-action="nav" data-view="audit"><div class="module-icon">🛡️</div><b>Audit</b><span>Review security and operational activity.</span></div>
  </div>

  <div class="section-title" style="margin-top:22px;">Recent activity <button class="btn btn-outline btn-sm" data-action="nav" data-view="audit">View audit trail →</button></div>
  <section class="ops-card"><div class="ops-card-body">
    ${!recentActivity.length ? '<div class="empty" style="padding:24px;">No activity recorded yet.</div>' :
      recentActivity.map(l=>`<div class="activity-row"><div class="activity-icon">${ACTIVITY_ICON[l.action]||"•"}</div><div style="flex:1"><b style="font-size:12.5px;">${esc(l.actorName)}</b><div style="font-size:12px;color:var(--text-muted);">${esc(l.action.replace(/_/g," "))}</div><div style="font-size:11px;color:var(--text-faint);margin-top:2px;">${fmtDateTime(l.date)}</div></div></div>`).join("")}
  </div></section>`;
}
/* ============================================================
   CLIENTS
   ============================================================ */
async function loadClients(search=""){
  renderShell(loadingSkeleton(), "Clients");
  try{
    const qs = search ? "?search="+encodeURIComponent(search) : "";
    const {clients} = await api("/api/clients"+qs);
    state.cache.clients = clients;
    renderShell(clientsHtml(clients, search), "Clients");
    const input = document.getElementById("client-search");
    if(input) input.focus({preventScroll:true});
  }
  catch(e){ renderShell(errorState("Couldn't load clients."), "Clients"); }
}
function clientsHtml(clients, search=""){
  return `
  <div class="row-between" style="margin-bottom:12px;gap:10px;">
    <input id="client-search" value="${esc(search)}" placeholder="🔍 Search name or phone..." style="flex:1;max-width:320px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);">

      <tr>
        <td><div class="row"><div class="avatar" style="width:30px;height:30px;font-size:11px;">${initials(c.name)}</div><b>${esc(c.name)}</b></div></td>
        <td>${esc(c.phone||"—")}</td>

        <td>
          <button class="action-btn" data-action="edit-client" data-id="${c.id}" title="Edit">✏️</button>

            ? `<button class="action-btn" data-action="approve-client" data-id="${c.id}" title="Reactivate">✅</button>`

function csvEscape(v){ const s=String(v??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

    ${(t.replies||[]).map(r=>`<div style="background:var(--blue-light);padding:10px 12px;border-radius:10px;margin-bottom:8px;"><b style="font-size:12px;color:var(--blue);">${esc(r.author)}</b><div style="font-size:13px;margin-top:3px;">${esc(r.message)}</div></div>`).join("")}
    <form data-form="ticket-reply" data-id="${id}">
      <div class="field"><label>Reply</label><textarea name="reply" placeholder="Type a response…"></textarea></div>
      <div class="field"><label>Status</label><select name="status"><option value="open" ${t.status==='open'?'selected':''}>Open</option><option value="in-progress" ${t.status==='in-progress'?'selected':''}>In Progress</option><option value="resolved" ${t.status==='resolved'?'selected':''}>Resolved</option></select></div>
      <button class="btn btn-primary btn-block" type="submit">Update Ticket</button>
    </form>
  `, `<button class="btn btn-outline btn-block" data-action="close-modal">Close</button>`);
}

/* ============================================================
   CLIENT CHAT
   ============================================================ */
async function loadChat(){
  renderShell(`<div id="chat-container">${loadingSkeleton()}</div>`, "Client Chat");
  await refreshChatList();
  state.chatPoll = setInterval(()=>{ if(state.activeChatClient) refreshChatThread(state.activeChatClient); refreshChatList(true); }, 4000);
}
async function refreshChatList(silent){
  try{
    const {conversations} = await api("/api/chat/conversations");
    state.cache.conversations = conversations;
    if(!silent){
      const el = document.getElementById("chat-container");
      if(el) el.innerHTML = chatShellHtml(conversations);
    }
  }catch(e){}
}
function chatShellHtml(conversations){
  return `<div class="grid grid-2" style="align-items:start;">
    <div class="card" style="max-height:560px;overflow-y:auto;">
      ${!conversations.length ? `<div class="empty"><div class="ic">💬</div>No client conversations yet.</div>` :
      conversations.map(c=>`<div class="list-item" style="padding:12px 16px;cursor:pointer;" data-action="open-chat" data-id="${c.clientId}">
        <div class="avatar">${initials(c.clientName)}</div>
        <div style="flex:1;"><div class="row-between"><b style="font-size:13px;">${esc(c.clientName)}</b>${c.unread?`<span class="badge badge-red">${c.unread}</span>`:""}</div>
        <div style="font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.lastMessage)}</div></div>
      </div>`).join("")}
    </div>
    <div id="chat-thread-panel"><div class="card empty"><div class="ic">💬</div>Select a conversation</div></div>
  </div>`;
}
async function openChatThread(clientId){
  state.activeChatClient = clientId;
  await refreshChatThread(clientId);
}
async function refreshChatThread(clientId){
  try{
    const {messages} = await api("/api/chat/"+clientId);
    const panel = document.getElementById("chat-thread-panel");
    if(!panel) return;
    panel.innerHTML = `<div class="card" style="display:flex;flex-direction:column;height:480px;">
      <div class="chat-thread" id="admin-chat-thread" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;">
        ${messages.map(m=>`<div style="align-self:${m.sender==='company'?'flex-end':'flex-start'};max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;background:${m.sender==='company'?'var(--green)':'var(--sand-deep)'};color:${m.sender==='company'?'#fff':'inherit'};">${esc(m.message)}</div>`).join("") || `<div class="field-hint">No messages yet.</div>`}
      </div>
      <form data-form="admin-chat" data-id="${clientId}" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);">
        <input name="message" placeholder="Reply…" required style="flex:1;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);">
        <button class="btn btn-primary btn-sm" type="submit">Send</button>
      </form>
    </div>`;
    const thread = document.getElementById("admin-chat-thread");
    if(thread) thread.scrollTop = thread.scrollHeight;
  }catch(e){}
}

function broadcastModal(){

  renderShell(`
  <div class="card card-pad" style="max-width:420px;margin-bottom:16px;">
    <div class="row" style="margin-bottom:14px;"><div class="avatar" style="width:52px;height:52px;">${initials(state.user.name)}</div><div><b>${esc(state.user.name)}</b></div></div>
    <button class="btn btn-outline btn-sm" data-action="edit-profile">Edit Profile</button><button class="btn btn-primary btn-sm" style="margin-left:8px;" data-action="register-passkey">🔐 Enable Biometrics</button>

  showModal("Edit Profile", `<form data-form="edit-profile">
    <div class="field"><label>Name</label><input name="name" value="${esc(state.user.name)}" required></div>
    <div class="field"><label>Phone</label><input name="phone" value="${esc(state.user.phone||'')}"></div>
    <button class="btn btn-primary btn-block" type="submit">Save Changes</button>
  </form>`, "");

  showModal("API Server Address", `<form data-form="edit-api">
    <div class="field"><label>Base URL</label><input name="apiBase" value="${esc(CONFIG.apiBase)}" required></div>
    <button class="btn btn-primary btn-block" type="submit">Save</button>
  </form>`, "");
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title, body, footer){
  const existing = document.getElementById("modal-root"); if(existing) existing.remove();
  const wrap = document.createElement("div");
  wrap.id = "modal-root"; wrap.className = "modal-overlay";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-header"><b style="font-size:16px;">${title}</b><button class="icon-btn" data-action="close-modal" style="width:30px;height:30px;">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer?`<div class="modal-footer">${footer}</div>`:""}
  </div>`;
  wrap.addEventListener("click", e=>{ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
  enhanceSecretFields(wrap);
}
function closeModal(){ const m=document.getElementById("modal-root"); if(m) m.remove(); }

/* ============================================================
   ROUTER
   ============================================================ */
const LOADERS = {
  dashboard: loadDashboard, clients: loadClients, projects: ()=>loadProjects(),
  staff: loadStaff, equipment: ()=>loadEquipment(), finance: ()=>loadFinance(),
  tickets: loadTickets, chat: loadChat, notifications: loadNotifications,
  cms: loadCms, roles: loadRoles, audit: loadAudit, settings: loadSettings,
};
function enhanceSecretFields(root=document){
   root.querySelectorAll('input[type="password"]').forEach((input)=>{
     if(input.dataset.secretEnhanced) return;
     input.dataset.secretEnhanced="1";
     const wrap=document.createElement("div");
     wrap.className="secret-field";
     input.parentNode.insertBefore(wrap,input);
     wrap.appendChild(input);
     const btn=document.createElement("button");
     btn.type="button"; btn.className="secret-toggle"; btn.dataset.action="toggle-secret";
     btn.setAttribute("aria-label","Show password"); btn.title="Show password"; btn.textContent="👁️";
     wrap.appendChild(btn);
   });
 }
 function render(){
  if(state.chatPoll){ clearInterval(state.chatPoll); state.chatPoll=null; state.activeChatClient=null; }
  if(!state.token || !state.user){ renderAuth(); enhanceSecretFields(); return; }
  (LOADERS[state.view] || loadDashboard)();
  enhanceSecretFields();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-action]"); if(!t) return;
  const action = t.dataset.action;
  if(action==="toggle-secret"){
    const input=t.parentElement?.querySelector("input");
    if(input){ const visible=input.type==="text"; input.type=visible?"password":"text"; t.classList.toggle("active",!visible); t.textContent=visible?"👁️":"🙈"; t.setAttribute("aria-label",visible?"Show password":"Hide password"); t.title=visible?"Show password":"Hide password"; }
    return;
  }
  if(action==="passkey-login"){ signInWithPasskey(); return; }
  if(action==="register-passkey"){ registerPasskey(); return; }
  if(action==="nav"){ state.view=t.dataset.view; document.getElementById("sidebar")?.classList.remove("open"); render(); return; }
  if(action==="logout"){ logout(); return; }
  if(action==="toggle-theme"){ toggleTheme(); return; }
  if(action==="toggle-sidebar"){ document.getElementById("sidebar").classList.toggle("open"); return; }
  if(action==="close-sidebar"){ document.getElementById("sidebar").classList.remove("open"); return; }
  if(action==="close-modal"){ closeModal(); return; }
  if(action==="reload"){ render(); return; }

  if(action==="new-client"){ newClientModal(); return; }
  if(action==="export-clients-csv"){
    const rows = [["Name","Phone","Address","Status"], ...(state.cache.clients||[]).map(c=>[c.name,c.phone,c.address||"",c.status||"active"])];
    downloadCsv("ecostream-clients.csv", rows);
    return;
  }
  if(action==="edit-client"){ editClientModal(t.dataset.id); return; }
  if(action==="suspend-client"){
    if(!confirm("Suspend this client's access?")) return;
    try{ await api("/api/clients/"+t.dataset.id+"/status", {method:"PATCH", body:JSON.stringify({status:"suspended"})}); toast("Client suspended","success"); loadClients(); }catch{}
    return;
  }
  if(action==="approve-client"){
    try{ await api("/api/clients/"+t.dataset.id+"/status", {method:"PATCH", body:JSON.stringify({status:"active"})}); toast("Client reactivated","success"); loadClients(); }catch{}
    return;
  }
  if(action==="delete-client"){
    if(!confirm("Delete this client permanently? This cannot be undone.")) return;
    try{ await api("/api/clients/"+t.dataset.id, {method:"DELETE"}); toast("Client deleted","success"); loadClients(); }catch{}
    return;
  }

  if(action==="proj-tab"){ document.getElementById("view-root").innerHTML = projectsHtml(t.dataset.tab); return; }
  if(action==="open-project"){ openProjectDetail(t.dataset.id); return; }
  if(action==="booking-status"){
    try{ await api("/api/bookings/"+t.dataset.id, {method:"PUT", body:JSON.stringify({status:t.dataset.status})}); toast("Booking updated","success"); loadProjects("bookings"); }catch{}
    return;
  }
  if(action==="create-project-from-booking"){
    const b = state.cache.bookings.find(x=>x.id===t.dataset.id); if(!b) return;
    try{ await api("/api/projects", {method:"POST", body:JSON.stringify({clientId:b.clientId, location:b.drillingLocation, totalDepth:60})}); toast("Project created","success"); loadProjects("projects"); }catch{}
    return;
  }

  if(action==="new-staff"){ newStaffModal(); return; }
  if(action==="edit-staff"){ editStaffModal(t.dataset.id); return; }
  if(action==="delete-staff"){
    if(!confirm("Remove this staff member?")) return;
    try{ await api("/api/staff/"+t.dataset.id, {method:"DELETE"}); toast("Staff member removed","success"); loadStaff(); }catch{}
    return;
  }

  if(action==="equip-tab"){ renderShell(equipmentHtml(t.dataset.tab), "Equipment"); return; }
  if(action==="new-equipment"){ newEquipmentModal(); return; }
  if(action==="new-expense"){ newExpenseModal(); return; }
  if(action==="delete-equipment"){
    if(!confirm("Remove this equipment record?")) return;
    try{ await api("/api/equipment/"+t.dataset.id, {method:"DELETE"}); toast("Equipment removed","success"); loadEquipment(); }catch{}
    return;
  }
  if(action==="mark-maintenance"){
    try{ await api("/api/equipment/"+t.dataset.id, {method:"PUT", body:JSON.stringify({status:"active", lastMaintenance:new Date().toISOString().slice(0,10)})}); toast("Maintenance logged","success"); loadEquipment(); }catch{}
    return;
  }

  if(action==="fin-tab"){ await loadFinance(t.dataset.tab); return; }
  if(action==="report-range"){ await loadFinance("reports", t.dataset.range); return; }
  if(action==="new-invoice"){ newInvoiceModal(); return; }
  if(action==="export-invoices-csv"){
    const clients = state.cache.clients||[];
    const clientName = id => (clients.find(c=>c.id===id)||{}).name || "Unknown";
    const rows = [["Invoice","Client","Amount (GMD)","Method","Status","Date"], ...(state.cache.invoices||[]).map(i=>[i.invoiceNumber,clientName(i.clientId),i.amount,i.method,i.status,i.date])];
    downloadCsv("ecostream-invoices.csv", rows);
    return;
  }

  if(action==="open-ticket"){ openTicket(t.dataset.id); return; }
  if(action==="open-chat"){ document.querySelectorAll('[data-action="open-chat"]').forEach(el=>el.style.background=""); t.style.background="var(--sand-deep)"; openChatThread(t.dataset.id); return; }
  if(action==="broadcast"){ broadcastModal(); return; }
  if(action==="edit-profile"){ editProfileModal(); return; }
  if(action==="edit-api"){ editApiModal(); return; }
});

document.addEventListener("submit", async (e)=>{
  const form = e.target.closest("[data-form]"); if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());
  if (data.phone) data.phone = String(data.phone).replace(/\D/g, "");
  const submitBtn = form.querySelector("button[type=submit]");
  if(submitBtn){ submitBtn.disabled=true; submitBtn.dataset.origText=submitBtn.textContent; submitBtn.textContent="Please wait…"; }

  try{
    if(kind==="login"){
      const res = await api("/api/auth/admin-login", {method:"POST", body:JSON.stringify(data)});
      if(res.user.role!=="admin"){ toast("Administrator access only.", "error"); return; }
      setAuth(res.token, res.refreshToken, res.user); state.view="dashboard"; toast("Welcome back, "+res.user.name+"!", "success"); render();
    }
    else if(kind==="new-client"){ await api("/api/clients", {method:"POST", body:JSON.stringify(data)}); toast("Client created","success"); closeModal(); loadClients(); }
    else if(kind==="edit-client"){ await api("/api/clients/"+form.dataset.id, {method:"PUT", body:JSON.stringify(data)}); toast("Client updated","success"); closeModal(); loadClients(); }
    else if(kind==="update-project"){
      const patch = {...data};
      ["depth","totalDepth","waterYield"].forEach(k=>{ if(patch[k]!=="") patch[k]=Number(patch[k]); });
      if(!patch.assignedEngineerId) delete patch.assignedEngineerId;
      await api("/api/projects/"+form.dataset.id, {method:"PUT", body:JSON.stringify(patch)});
      toast("Project updated","success"); closeModal(); loadProjects();
    }
    else if(kind==="add-timeline"){
      await api("/api/projects/"+form.dataset.id+"/timeline", {method:"POST", body:JSON.stringify(data)});
      toast("Timeline event added","success"); openProjectDetail(form.dataset.id);
    }
    else if(kind==="new-staff"){ const res=await api("/api/staff", {method:"POST", body:JSON.stringify(data)}); toast("Staff account created successfully","success"); closeModal(); loadStaff(); }
    else if(kind==="edit-staff"){ await api("/api/staff/"+form.dataset.id, {method:"PUT", body:JSON.stringify(data)}); toast("Staff updated","success"); closeModal(); loadStaff(); }
    else if(kind==="new-equipment"){ await api("/api/equipment", {method:"POST", body:JSON.stringify(data)}); toast("Equipment added","success"); closeModal(); loadEquipment(); }
    else if(kind==="new-expense"){ data.amount=Number(data.amount); await api("/api/expenses", {method:"POST", body:JSON.stringify(data)}); toast("Expense logged","success"); closeModal(); loadEquipment("expenses"); }
    else if(kind==="new-invoice"){ data.amount=Number(data.amount); await api("/api/payments", {method:"POST", body:JSON.stringify(data)}); toast("Payment recorded","success"); closeModal(); loadFinance(); }
    else if(kind==="ticket-reply"){ await api("/api/tickets/"+form.dataset.id, {method:"PUT", body:JSON.stringify(data)}); toast("Ticket updated","success"); closeModal(); loadTickets(); }
    else if(kind==="admin-chat"){ form.reset(); await api("/api/chat/"+form.dataset.id, {method:"POST", body:JSON.stringify(data)}); refreshChatThread(form.dataset.id); }
    else if(kind==="broadcast"){ if(!data.userId) delete data.userId; await api("/api/notifications", {method:"POST", body:JSON.stringify(data)}); toast("Notification sent","success"); closeModal(); loadNotifications(); }
    else if(kind==="cms"){ await api("/api/cms", {method:"PUT", body:JSON.stringify(data)}); toast("Site content updated","success"); }
    else if(kind==="edit-profile"){ const res=await api("/api/auth/profile", {method:"PUT", body:JSON.stringify(data)}); state.user=res.user; localStorage.setItem("eco_user", JSON.stringify(res.user)); toast("Profile updated","success"); closeModal(); loadSettings(); }
    else if(kind==="edit-api"){ CONFIG.apiBase=data.apiBase.replace(/\/$/,""); localStorage.setItem("eco_api_base", CONFIG.apiBase); toast("API server updated","success"); closeModal(); render(); }
  }catch(err){ /* toast already shown */ }
  finally{ if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent=submitBtn.dataset.origText; } }
});

let searchDebounce = null;
document.addEventListener("input", (e)=>{
  if(e.target.id === "client-search"){
    clearTimeout(searchDebounce);
    const value = e.target.value;
    searchDebounce = setTimeout(()=>loadClients(value), 350);
  }
});

/* ---------- init ---------- */
initTheme();
render();

})();
</script>
