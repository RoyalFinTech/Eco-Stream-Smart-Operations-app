<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoStream — Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ECOSTREAM CLIENT PORTAL — design tokens
   Palette: deep water-green + blue (water) + warm sand + charcoal
   Display face: Fraunces (characterful serif for headings)
   Body/UI face: Inter
   Signature element: circular "depth gauge" — a borehole-specific
   progress ring used for drilling/water-yield tracking, standing
   in for the generic linear progress bar you'd see elsewhere.
   ============================================================ */
:root{
  --green:#0B8F4D; --green-dark:#064D28; --green-deepest:#052E18;
  --blue:#1565C0; --blue-light:#E8F2FC;
  --sand:#F6F8F5; --sand-deep:#ECF1EC;
  --charcoal:#16211B; --charcoal-soft:#3A4A42;
  --amber:#F0932B; --amber-light:#FDF1E4;
  --red:#D6534A; --red-light:#FBEAE8;
  --card:#FFFFFF; --border:#E1E8E3; --text:#182620; --text-muted:#5B6E64; --text-faint:#8FA298;
  --glass:rgba(255,255,255,.66); --glass-border:rgba(255,255,255,.5);
  --radius:18px; --radius-sm:12px;
  --shadow-soft:0 8px 30px rgba(10,40,25,.08);
  --shadow-lift:0 16px 44px rgba(10,40,25,.14);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
html[data-theme="dark"]{
  --sand:#0D1712; --sand-deep:#0A130F;
  --card:#152019; --border:#25342B; --text:#EAF2EC; --text-muted:#9CB0A5; --text-faint:#5F756A;
  --glass:rgba(21,32,25,.6); --glass-border:rgba(255,255,255,.08);
  --blue-light:#132A44; --amber-light:#3A2A10; --red-light:#3A1414;
  --shadow-soft:0 8px 30px rgba(0,0,0,.35); --shadow-lift:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body); background:var(--sand); color:var(--text);
  transition:background .25s ease, color .25s ease;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display);}
a{color:inherit;}
button,input,select,textarea{font-family:inherit; font-size:14px;}
button{cursor:pointer;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes ripple{0%{stroke-dashoffset:283;} 100%{stroke-dashoffset:var(--target-offset);}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

.view{animation:fadeUp .35s ease both;}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:12px; border:1.5px solid transparent; font-weight:600; font-size:14px; transition:transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 6px 18px rgba(11,143,77,.28);}
.btn-primary:hover{background:var(--green-dark);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--green); color:var(--green);}
.btn-danger{background:var(--red); color:#fff;}
.btn-ghost{background:rgba(255,255,255,.12); color:#fff; border:none;}
.btn-sm{padding:7px 14px; font-size:12.5px; border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55; cursor:not-allowed;}

/* ---------- forms ---------- */
.field{margin-bottom:16px; text-align:left;}
 .secret-field{position:relative;}
 .secret-field input{padding-right:48px!important;}
 .secret-toggle{position:absolute;right:8px;bottom:7px;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;}
 .secret-toggle:hover,.secret-toggle.active{background:var(--sand-deep);color:var(--blue);}
.field label{display:block; font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--card); color:var(--text);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(11,143,77,.12);}
.field textarea{min-height:96px; resize:vertical;}
.field-error{color:var(--red); font-size:12px; margin-top:5px; font-weight:600;}
.field-hint{color:var(--text-faint); font-size:12px; margin-top:5px;}

/* ---------- glass / cards ---------- */
.glass{background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border);}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-soft); transition:transform .18s ease, box-shadow .18s ease;}
.card-hover:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift);}
.card-pad{padding:20px;}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; letter-spacing:.02em; padding:4px 11px; border-radius:99px; text-transform:uppercase;}
.badge-green{background:#E4F5EC; color:var(--green-dark);}
.badge-blue{background:var(--blue-light); color:var(--blue);}
.badge-amber{background:var(--amber-light); color:var(--amber);}
.badge-red{background:var(--red-light); color:var(--red);}
.badge-grey{background:var(--sand-deep); color:var(--text-muted);}
html[data-theme="dark"] .badge-green{background:#0F3323;}

/* ---------- depth gauge (signature element) ---------- */
.gauge{position:relative; width:84px; height:84px; flex-shrink:0;}
.gauge svg{transform:rotate(-90deg);}
.gauge circle{fill:none; stroke-width:8;}
.gauge .track{stroke:var(--sand-deep);}
.gauge .fill{stroke:var(--blue); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.gauge .fill.complete{stroke:var(--green);}
.gauge-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge-label b{font-size:16px; line-height:1;}
.gauge-label span{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}

/* ---------- toasts ---------- */
#toast-root{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--charcoal); color:#fff; padding:12px 20px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:fadeUp .25s ease;}
.toast.error{background:var(--red);}
.toast.success{background:var(--green-dark);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(10,20,15,.55); backdrop-filter:blur(3px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .2s ease;}
.modal{background:var(--card); border-radius:20px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lift); animation:fadeUp .25s ease;}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-body{padding:22px;}
.modal-footer{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

/* ---------- layout: auth ---------- */
.auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(circle at 20% 15%, var(--green-dark), var(--green-deepest) 60%);}
.auth-box{width:100%; max-width:420px;}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; color:#fff; text-align:center;}
.auth-logo .mark{width:60px; height:60px; border-radius:16px; background:linear-gradient(135deg,var(--green),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:28px;}
.auth-logo h1{font-size:24px; letter-spacing:.02em;}
.auth-logo p{font-size:12px; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.12em; font-weight:700;}
.auth-tabs{display:flex; gap:6px; background:rgba(255,255,255,.1); padding:4px; border-radius:14px; margin-bottom:18px;}
.auth-tabs button{flex:1; padding:10px 0; border:none; background:transparent; color:rgba(255,255,255,.6); font-weight:700; font-size:13px; border-radius:10px;}
.auth-tabs button.active{background:#fff; color:var(--green-dark);}
.auth-card{background:#fff; border-radius:20px; padding:26px; box-shadow:0 30px 70px rgba(0,0,0,.35);}
 .auth-foot{text-align:center; margin-top:16px; color:rgba(255,255,255,.5); font-size:12px; line-height:1.7;} .auth-foot span{color:rgba(255,255,255,.78);font-weight:700;} .auth-security{margin-top:14px;padding:15px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.06);color:#fff;text-align:center;} .auth-security-title{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;} .auth-security-copy{font-size:11px;color:rgba(255,255,255,.52);margin:5px 0 10px;} .admin-access{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:12px;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.08);} .admin-access:hover{background:rgba(255,255,255,.14);} .auth-support-card{padding:12px;border-radius:12px;background:var(--sand-deep);color:var(--text-muted);font-size:12px;line-height:1.5;}
.auth-link{background:none; border:none; color:#fff; font-weight:700; text-decoration:underline; cursor:pointer; font-size:13px;}

.phone-control{display:flex;align-items:stretch;border:1.5px solid var(--border);border-radius:11px;overflow:hidden;background:var(--card);}
.phone-control:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(11,143,77,.12);}
.phone-country{display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--sand-deep);font-weight:800;font-size:12px;color:var(--text-muted);white-space:nowrap;border-right:1px solid var(--border);}
.phone-control input{border:0!important;box-shadow:none!important;border-radius:0!important;flex:1;min-width:0;}
.availability{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 10px;border-radius:10px;font-size:11.5px;font-weight:700;border:1px solid transparent;transition:.2s;}
.availability.checking{background:var(--sand-deep);color:var(--text-muted);border-color:var(--border);}
.availability.available{background:#E8F7EF;color:var(--green-dark);border-color:#BDE7CF;}
.availability.taken{background:var(--red-light);color:var(--red);border-color:#F0C1BD;}
.availability .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}
.biometric-option{margin:14px 0;padding:14px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(135deg,var(--sand),var(--blue-light));}
.biometric-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.biometric-copy{display:flex;align-items:center;gap:10px;}
.biometric-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow-soft);font-size:19px;}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch-track{position:absolute;inset:0;border-radius:99px;background:var(--border);transition:.2s;cursor:pointer;}
.switch-track:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.2s;}
.switch input:checked + .switch-track{background:var(--green);}
.switch input:checked + .switch-track:before{transform:translateX(20px);}
.biometric-status{font-size:11px;color:var(--text-muted);line-height:1.45;margin-top:7px;}
.error-card{display:flex;gap:12px;padding:14px;border-radius:15px;background:var(--red-light);border:1px solid #F0C1BD;color:var(--text);line-height:1.45;}
.error-card .error-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#fff;color:var(--red);font-size:19px;flex:0 0 auto;}
.error-card h4{font-size:14px;margin-bottom:3px;}
.error-card p{font-size:12px;color:var(--text-muted);}
.returning-card{max-width:470px;margin:0 auto;padding:28px;border:1px solid var(--border);border-radius:22px;background:var(--card);box-shadow:var(--shadow);}
.returning-account{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--sand);margin-bottom:18px;}
.returning-account .mini-avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;}
.returning-actions{display:grid;gap:10px;margin-top:14px;}
.security-setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 18px;}
.security-setting-copy{display:flex;gap:11px;align-items:flex-start;}
.security-setting-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--blue-light);font-size:20px;flex:0 0 auto;}
.security-setting small{display:block;color:var(--text-muted);font-size:11px;line-height:1.45;margin-top:3px;}
.security-state{font-size:11px;color:var(--text-muted);margin-top:8px;}
.profile-switch{position:relative;width:52px;height:30px;flex:0 0 auto;}
.profile-switch input{opacity:0;width:0;height:0;position:absolute;}
.profile-switch .track{position:absolute;inset:0;border-radius:99px;background:var(--border);cursor:pointer;transition:.2s;}
.profile-switch .track:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.2s;}
.profile-switch input:checked + .track{background:var(--green);}
.profile-switch input:checked + .track:before{transform:translateX(22px);}
@media(max-width:560px){.returning-card{padding:22px;border-radius:18px}.security-setting{padding:14px}.auth-box{width:min(100%,560px);padding:12px;}}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;border-top:1px solid var(--border);color:var(--text-faint);font-size:11px;background:var(--card);}
.site-footer span:last-child{font-weight:800;color:var(--green);}
@media(max-width:700px){.site-footer{padding:14px 16px;flex-direction:column;text-align:center;}}

/* ---------- layout: app shell ---------- */
.app-shell{min-height:100vh; display:flex;}
.sidebar{width:230px; background:var(--charcoal); color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:200;}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:22px 20px; border:0; border-bottom:1px solid rgba(255,255,255,.08); width:100%; text-align:left; color:inherit; background:transparent; cursor:pointer;}
.sidebar .brand .mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--green),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:16px;}
.sidebar .brand b{font-size:15px;}
.sidebar .brand span{display:block; font-size:9px; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.1em;}
.nav-list{flex:1; overflow-y:auto; padding:14px 12px;}
.nav-item{display:flex; align-items:center; gap:12px; width:100%; padding:11px 14px; border-radius:11px; background:transparent; border:none; color:rgba(255,255,255,.62); font-size:13.5px; font-weight:600; margin-bottom:2px; text-align:left; transition:background .15s ease, color .15s ease;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(135deg, var(--green), var(--green-dark)); color:#fff;}
.nav-item .ic{width:18px; text-align:center; font-size:15px;}
.sidebar-foot{padding:14px; border-top:1px solid rgba(255,255,255,.08);}

.main{flex:1; margin-left:230px; display:flex; flex-direction:column; min-height:100vh;}
.app-footer-nav{display:flex;flex-wrap:wrap;gap:7px;padding:14px 22px;border-top:1px solid var(--border);background:var(--card);}
.app-footer-nav button{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);padding:9px 12px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;}
.app-footer-nav button:hover,.app-footer-nav button.active{color:var(--green);border-color:var(--green);background:var(--sand);}
.app-footer-nav .nav-ic{font-size:15px;}
.avatar{overflow:hidden;}
.avatar img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit;}
.profile-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:18px;align-items:start;}
.profile-identity{display:flex;align-items:center;gap:18px;text-align:left;}
.profile-identity .avatar{width:86px;height:86px;font-size:26px;}
.profile-card-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;}
.profile-info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;}
.profile-info-item{padding:13px;border-radius:13px;background:var(--sand);min-width:0;}
.profile-info-item small{display:block;color:var(--text-muted);font-size:11px;margin-bottom:4px;}
.profile-info-item b{font-size:13px;overflow-wrap:anywhere;}
.dashboard-quick-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0;}
.dashboard-quick-link{display:flex;align-items:center;gap:11px;text-align:left;padding:14px;border:1px solid var(--border);border-radius:15px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer;min-width:0;}
.dashboard-quick-link .quick-icon{width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;border-radius:12px;background:var(--sand);font-size:18px;}
.dashboard-quick-link small{display:block;font-size:11px;color:var(--text-muted);font-weight:500;margin-top:3px;}
.mobile-bottom-nav{display:none;}
.topbar{position:sticky; top:0; z-index:150; display:flex; align-items:center; gap:14px; padding:14px 28px; background:var(--glass); backdrop-filter:blur(14px); border-bottom:1px solid var(--border);}
.topbar h2{font-size:18px;}
.topbar .spacer{flex:1;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:16px; position:relative; color:var(--text);}
.icon-btn .dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--red); border:2px solid var(--card);}
.content{padding:26px 28px 90px; flex:1;}

.mobile-nav{display:none;}
.hamburger{display:none;}

@media (max-width: 880px){
  .sidebar{transform:translateX(-100%); transition:transform .25s ease; width:250px;}
  .sidebar.open{transform:translateX(0); box-shadow:20px 0 50px rgba(0,0,0,.3);}
  .main{margin-left:0;}
  .hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card); font-size:18px;}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190;}
  .sidebar-scrim.show{display:block;}
  .content{padding:18px 16px 105px;}
  .topbar{padding:12px 16px;}
  .app-footer-nav{display:none;}
  .mobile-bottom-nav{display:flex;position:fixed;z-index:180;left:0;right:0;bottom:0;padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(18px);border-top:1px solid var(--border);justify-content:space-around;gap:2px;}
  .mobile-bottom-nav button{display:flex;flex:1;min-width:0;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:0;border-radius:10px;padding:6px 2px;background:transparent;color:var(--text-muted);font-size:9px;font-weight:700;white-space:nowrap;}
  .mobile-bottom-nav button .nav-ic{font-size:18px;line-height:1.1;}
  .mobile-bottom-nav button.active{background:var(--sand);color:var(--green);}
  .profile-layout{grid-template-columns:1fr;}
  .dashboard-quick-links{grid-template-columns:repeat(2,minmax(0,1fr));}
  .app-footer-nav{padding-bottom:12px;}
}

/* ---------- grids & misc ---------- */
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:700px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} .profile-info-grid{grid-template-columns:1fr;} .profile-identity .avatar{width:72px;height:72px;} }
.stat-card{padding:18px; border-radius:16px; background:var(--card); border:1px solid var(--border);}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:700;}
.stat-card .lbl{font-size:12px; color:var(--text-muted); margin-top:4px;}
.empty{text-align:center; padding:50px 20px; color:var(--text-muted);}
.empty .ic{font-size:38px; margin-bottom:10px;}
.section-title{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:22px 0 10px;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:var(--sand-deep); font-size:12.5px; font-weight:600; border:1.5px solid transparent; cursor:pointer;}
.chip.active{background:var(--green); color:#fff;}
.list-item{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.avatar{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.hero-band{background:linear-gradient(120deg, var(--green-dark), var(--green) 60%, var(--blue)); border-radius:22px; padding:26px; color:#fff; position:relative; overflow:hidden;}
.hero-band::after{content:""; position:absolute; right:-40px; bottom:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);}
.step-track{display:flex; gap:0; margin-bottom:22px;}
.step-track .step{flex:1; text-align:center; position:relative; font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.step-track .step::before{content:""; display:block; width:26px; height:26px; border-radius:50%; background:var(--sand-deep); margin:0 auto 6px; line-height:26px; color:var(--text-muted);}
.step-track .step.done::before{background:var(--green); }
.step-track .step.active::before{background:var(--blue);}
.chat-thread{display:flex; flex-direction:column; gap:10px; padding:6px 0;}
.chat-bubble{max-width:75%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.4;}
.chat-bubble.me{align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:4px;}
.chat-bubble.them{align-self:flex-start; background:var(--sand-deep); border-bottom-left-radius:4px;}
.chat-bubble .meta{display:block; font-size:10px; opacity:.65; margin-top:4px;}
.doc-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px;}
.doc-row .ic{font-size:20px;}
.upload-drop{border:2px dashed var(--border); border-radius:14px; padding:26px; text-align:center; color:var(--text-muted); cursor:pointer; transition:border-color .15s ease, background .15s ease;}
.upload-drop:hover{border-color:var(--green); background:var(--sand-deep);}
.skeleton{background:linear-gradient(90deg, var(--sand-deep) 25%, var(--border) 37%, var(--sand-deep) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}

/* === EcoStream Premium Client Experience v2 === */
.eco-promo-carousel{position:relative;margin:0 0 20px;border-radius:24px;overflow:hidden;background:var(--card);border:1px solid rgba(9,104,65,.14);box-shadow:0 16px 38px rgba(6,58,43,.09);isolation:isolate}
.eco-promo-track{display:grid;grid-template-columns:1fr;position:relative}
.eco-promo-slide{grid-area:1/1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);min-height:248px;opacity:0;visibility:hidden;transform:translateX(18px) scale(.99);transition:opacity .45s ease,transform .45s ease,visibility .45s;pointer-events:none;background:linear-gradient(115deg,#052c2a 0%,#075c42 55%,#087f50 100%);color:#fff}
.eco-promo-slide.is-active{opacity:1;visibility:visible;transform:translateX(0) scale(1);pointer-events:auto;z-index:1}
.eco-promo-copy{padding:27px 30px 25px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;position:relative;z-index:2}
.eco-promo-brand{display:flex;align-items:center;gap:9px;margin-bottom:15px}
.eco-promo-brand img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}
.eco-promo-brand strong{font-size:14px;letter-spacing:.025em}.eco-promo-brand small{display:block;font-size:10px;color:#b9ead5;margin-top:2px}
.eco-promo-kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#9ef0c8;font-weight:850;margin-bottom:8px}
.eco-promo-copy h2{font-family:var(--font-display);font-size:clamp(25px,3vw,38px);line-height:1.05;margin:0 0 10px;max-width:500px;color:#fff}
.eco-promo-copy p{font-size:13px;line-height:1.65;color:rgba(255,255,255,.8);max-width:460px;margin:0 0 16px}
.eco-promo-tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 17px}.eco-promo-tags span{font-size:10px;font-weight:750;border:1px solid rgba(190,255,224,.28);background:rgba(255,255,255,.08);padding:6px 9px;border-radius:999px;color:#e4fff1}
.eco-promo-cta{border:0;border-radius:999px;background:#c3f36a;color:#123c2a;padding:10px 17px;font-size:12px;font-weight:850;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.eco-promo-art{position:relative;display:grid;place-items:center;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 65% 25%,rgba(145,236,190,.28),transparent 42%),linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,0))}
.eco-promo-art:before,.eco-promo-art:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12);width:310px;height:310px;right:-60px;top:-105px}.eco-promo-art:after{width:235px;height:235px;right:-20px;top:-65px}
.eco-promo-art svg{position:relative;z-index:1;width:min(100%,420px);height:auto;max-height:250px;filter:drop-shadow(0 15px 14px rgba(0,0,0,.18))}
.eco-promo-controls{position:absolute;z-index:3;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:center;gap:7px;pointer-events:none}
.eco-promo-dot{pointer-events:auto;width:8px;height:8px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.52);cursor:pointer;transition:width .2s,background .2s}
.eco-promo-dot.is-active{width:24px;background:#c3f36a}
.eco-promo-arrow{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:34px;height:34px;border:1px solid rgba(255,255,255,.24);border-radius:50%;background:rgba(255,255,255,.94);color:#07583f;font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.12)}
.eco-promo-arrow.prev{left:12px}.eco-promo-arrow.next{right:12px}
@media(max-width:700px){.eco-promo-slide{grid-template-columns:1fr;min-height:0}.eco-promo-copy{padding:22px 21px 24px}.eco-promo-copy h2{font-size:27px;max-width:95%}.eco-promo-copy p{font-size:12px;max-width:95%;margin-bottom:12px}.eco-promo-brand{margin-bottom:11px}.eco-promo-art{min-height:150px;max-height:185px}.eco-promo-art svg{max-height:178px;width:min(100%,340px)}.eco-promo-art:before{width:210px;height:210px;top:-60px}.eco-promo-art:after{width:150px;height:150px;top:-30px}.eco-promo-arrow{top:auto;bottom:10px;transform:none;width:30px;height:30px}.eco-promo-arrow.prev{left:10px}.eco-promo-arrow.next{right:10px}.eco-promo-controls{bottom:18px}.eco-promo-cta{padding:9px 14px}}
@media(prefers-reduced-motion:reduce){.eco-promo-slide{transition:none}}

.client-hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 30px;color:#fff;background:linear-gradient(135deg,#071D2B,#0A5A3A 62%,#0B8F4D);box-shadow:0 22px 55px rgba(4,50,35,.17);margin-bottom:18px;}
.client-hero:after{content:"";position:absolute;width:240px;height:240px;border:38px solid rgba(255,255,255,.08);border-radius:50%;right:-55px;top:-100px;}
.client-hero h1{font-family:var(--font-display);font-size:31px;line-height:1.1;margin:5px 0 8px;}
.client-hero p{font-size:13px;color:rgba(255,255,255,.78);max-width:570px;line-height:1.55;}
.client-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px;}
.client-actions .btn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);color:#fff;}
.client-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px;}
.client-kpi{border:1px solid rgba(15,42,55,.09);border-radius:19px;padding:16px;background:rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(9,35,25,.07);transition:.2s;}
.client-kpi:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(9,35,25,.11);}
.client-kpi .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#E8F7F0;margin-bottom:12px;}
.client-kpi .value{font-size:24px;font-weight:850;letter-spacing:-.04em;}
.client-kpi .label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;color:var(--text-muted);margin-top:3px;}
.client-main-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px;}
.client-panel{background:rgba(255,255,255,.92);border:1px solid rgba(15,42,55,.09);border-radius:21px;box-shadow:var(--shadow-soft);overflow:hidden;}
.client-panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--border);}
.client-panel-head h3{font-family:var(--font-body);font-size:14px;font-weight:800;}
.client-panel-body{padding:18px 19px;}
.client-feature{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.client-feature-card{border-radius:18px;padding:18px;min-height:145px;color:#fff;background:linear-gradient(145deg,#0A5A3A,#0B8F4D);position:relative;overflow:hidden;}
.client-feature-card.blue{background:linear-gradient(145deg,#123A68,#1565C0);}
.client-feature-card:after{content:"";position:absolute;width:120px;height:120px;border:22px solid rgba(255,255,255,.08);border-radius:50%;right:-35px;bottom:-55px;}
.client-feature-card h3{font-family:var(--font-body);font-size:15px;margin:7px 0;}
.client-feature-card p{font-size:11px;color:rgba(255,255,255,.74);line-height:1.5;}
.client-feature-card .btn{margin-top:13px;color:#fff;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.10);}
.client-ai{background:linear-gradient(145deg,#071D2B,#0B3A35);color:#fff;border-radius:19px;padding:19px;}
.client-ai .badge{display:inline-flex;background:rgba(34,211,238,.13);color:#67E8F9;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;}
.client-ai h3{font-family:var(--font-body);font-size:15px;margin:11px 0 6px;}
.client-ai p{font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.7);}
.booking-shell{max-width:900px;margin:0 auto;}
.booking-hero{background:linear-gradient(135deg,#071D2B,#0B8F4D);border-radius:24px;padding:22px 24px;color:#fff;margin-bottom:15px;}
.booking-hero h1{font-family:var(--font-display);font-size:27px;}
.booking-hero p{font-size:12px;color:rgba(255,255,255,.75);margin-top:5px;}
.booking-stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px;}
.booking-step{padding:10px;border-radius:13px;background:var(--card);border:1px solid var(--border);font-size:10px;font-weight:800;color:var(--text-muted);}
.booking-step.active{background:#E8F7F0;border-color:#A7E8C7;color:var(--green-dark);}
.booking-card{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:20px;box-shadow:var(--shadow-soft);}
.booking-service-intro{margin:0 0 14px;color:var(--text-muted);font-size:12px;line-height:1.6;}
.booking-services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 20px;}
.booking-service{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;min-width:0;padding:13px 11px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);cursor:pointer;transition:border-color .16s,background .16s,transform .16s;min-height:96px;}
.booking-service:active{transform:scale(.985);}
.booking-service.active{border-color:#0B8F4D;background:linear-gradient(135deg,#E9F9F0,#F8FFFB);box-shadow:0 5px 16px rgba(11,143,77,.10);}
.booking-service-icon{display:grid;place-items:center;flex:0 0 37px;width:37px;height:37px;border-radius:12px;background:linear-gradient(145deg,#0B9C5A,#076A3C);color:#fff;font-size:19px;}
.booking-service.active .booking-service-icon{box-shadow:0 4px 10px rgba(11,143,77,.22);}
.booking-service-copy{min-width:0;flex:1;}
.booking-service-title{display:block;font-size:12px;font-weight:850;line-height:1.35;}
.booking-service-description{display:block;margin-top:5px;font-size:10px;line-height:1.45;color:var(--text-muted);}
.booking-service-check{display:none;color:#0B8F4D;font-weight:900;font-size:12px;}
.booking-service.active .booking-service-check{display:block;}
.booking-form-section{border-top:1px solid var(--border);padding-top:18px;margin-top:10px;}
.booking-selected-service{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:12px;border-radius:14px;background:var(--surface-muted, #F3F8F5);}
.booking-selected-service strong{display:block;font-size:13px;}
.booking-selected-service span{display:block;margin-top:3px;color:var(--text-muted);font-size:11px;line-height:1.4;}
.booking-fields-heading{font-size:13px;font-weight:850;margin:0 0 12px;}
@media(max-width:420px){.booking-services{gap:8px}.booking-service{padding:11px 9px;gap:8px;min-height:100px}.booking-service-icon{width:32px;height:32px;flex-basis:32px;font-size:17px}.booking-service-title{font-size:11px}.booking-service-description{font-size:9.5px}.booking-card{padding:15px}}
.location-card{position:relative;overflow:hidden;border:1px solid rgba(16,145,83,.22);background:linear-gradient(135deg,#effcf5 0%,#ffffff 54%,#e0f8eb 100%);border-radius:20px;padding:16px;margin:14px 0 18px;box-shadow:0 10px 26px rgba(10,115,67,.07);}
.location-card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,#20b66c,#087342);border-radius:20px 0 0 20px;}
.location-card-head{display:flex;align-items:flex-start;gap:12px;}
.location-card-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#17a765,#087342);color:#fff;font-size:21px;box-shadow:0 6px 13px rgba(8,115,66,.2);}
.location-card-copy{flex:1;min-width:0;}
.location-card-title{font-size:14px;font-weight:850;color:#103e2b;line-height:1.35;}
.location-card-subtitle{font-size:11px;line-height:1.55;color:#5a7266;margin-top:4px;}
.location-optional{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#d7f5e4;color:#087342;font-size:9px;font-weight:850;letter-spacing:.07em;white-space:nowrap;}
.location-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:11px 13px;border:1px solid #a6ddbd;border-radius:13px;background:rgba(255,255,255,.82);color:#087342;font-weight:800;font-size:12px;cursor:pointer;}
.location-toggle:active{transform:scale(.99);}
.location-details{padding-top:15px;margin-top:14px;border-top:1px solid rgba(8,115,66,.13);}
.location-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.location-actions .btn{font-size:11px;}
.location-card .field label{font-size:11px;color:#527263;}
.location-card .field input{background:#fff;border-color:#dcebe2;}
@media(prefers-color-scheme:dark){.location-card{background:linear-gradient(135deg,#102c20,#142b22 55%,#173c2a);border-color:#2a6548}.location-card-title{color:#e1f8e9}.location-card-subtitle,.location-card .field label{color:#b4d4c2}.location-toggle{background:#183c2a;color:#b8f2ce;border-color:#356d50}.location-card .field input{background:#12271d;border-color:#315c46;color:#edf9f1}.location-optional{background:#174b31;color:#baf1cf}}
@media(max-width:900px){.client-kpis{grid-template-columns:repeat(2,1fr)}.client-main-grid{grid-template-columns:1fr}}
@media(max-width:650px){.client-hero{padding:22px 19px}.client-hero h1{font-size:27px}.client-kpis{gap:9px}.client-kpi{padding:13px}.client-kpi .value{font-size:21px}.client-feature{grid-template-columns:1fr}.booking-card{padding:15px}.booking-step{padding:8px 6px;font-size:9px}}

<body>
<div id="toast-root"></div>
<div id="app"></div>
<script>
/* ============================================================
   ECOSTREAM CLIENT PORTAL — application logic
   Vanilla JS, no build step. Talks to the EcoStream API (Node,
   zero external deps) over fetch(). Views are template strings;
   a single delegated click/submit handler dispatches on
   data-action / data-form attributes instead of wiring one
   listener per element.
   ============================================================ */
(function(){
"use strict";

/* ---------- config & state ---------- */
const CONFIG = (() => {
  const stored = localStorage.getItem("eco_api_base");
  const browserOrigin = (location.protocol === "http:" || location.protocol === "https:") ? location.origin : "";
  const isLocalBrowser = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  const storedIsLocal = !!stored && (stored.startsWith("http://localhost:") || stored.startsWith("https://localhost:") || stored.startsWith("http://127.0.0.1:") || stored.startsWith("https://127.0.0.1:"));
  // Production is same-origin. Never trust a stale persisted API URL there;
  // only local development may override the API base.
  return { apiBase: isLocalBrowser && stored ? stored : (browserOrigin || "http://localhost:4000") };
})();
const state = {
  token: localStorage.getItem("eco_token") || null,
  refreshToken: localStorage.getItem("eco_refresh_token") || null,
  user: JSON.parse(localStorage.getItem("eco_user") || "null"),
  view: "dashboard",
  authMode: (location.pathname.endsWith("/returning") || localStorage.getItem("eco_returning_phone")) ? "returning" : "login", // login | returning | register | forgot | reset
  cache: {}, // simple per-view data cache populated by loaders
  chatPoll: null,
  registrationAvailabilityTimer: null,
  biometricPasskeys: [],
};

const app = document.getElementById("app");

/* ---------- helpers ---------- */
function gmd(n){ return "GMD " + Number(n||0).toLocaleString(); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }catch{ return d; } }
function fmtDateTime(d){ try{ return new Date(d).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch{ return d; } }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function defaultAvatarSvg(){
  return `<svg viewBox="0 0 120 120" role="img" aria-label="EcoStream 3D avatar" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8F5E5"/><stop offset="1" stop-color="#8DD7B1"/></linearGradient>
      <linearGradient id="avatar-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8CDA8"/><stop offset="1" stop-color="#C98050"/></linearGradient>
      <linearGradient id="avatar-shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27B875"/><stop offset="1" stop-color="#075C36"/></linearGradient>
      <linearGradient id="avatar-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35443B"/><stop offset="1" stop-color="#111B16"/></linearGradient>
    </defs>
    <circle cx="60" cy="60" r="60" fill="url(#avatar-bg)"/>
    <ellipse cx="60" cy="111" rx="42" ry="26" fill="#0B8F4D" opacity=".12"/>
    <path d="M20 120c3-23 18-35 40-35s37 12 40 35" fill="url(#avatar-shirt)"/>
    <path d="M47 81h26v19c-7 8-19 8-26 0z" fill="url(#avatar-face)"/>
    <ellipse cx="60" cy="53" rx="25" ry="30" fill="url(#avatar-face)"/>
    <path d="M35 51c-2-21 10-36 28-35 17 1 25 13 23 31l-7-10c-11 2-25-3-32-11-2 11-6 18-12 25z" fill="url(#avatar-hair)"/>
    <path d="M43 53c4-3 8-3 12 0M66 53c4-3 8-3 12 0" fill="none" stroke="#493024" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M57 65c2 2 5 2 7 0" fill="none" stroke="#8D4B32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M48 73c7 6 17 6 24 0" fill="none" stroke="#8D4B32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M48 89l12 12 12-12" fill="#fff" opacity=".92"/>
    <path d="M54 99l6 8 6-8" fill="#1565C0"/>
    <circle cx="95" cy="25" r="12" fill="#fff" opacity=".65"/><path d="M89 25l4 4 8-9" fill="none" stroke="#0B8F4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function avatarMarkup(user, extraStyle=""){
  const avatarUrl=String(user?.avatarUrl||"");
  return `<div class="avatar" style="${extraStyle}">${avatarUrl?`<img src="${esc(avatarUrl)}" alt="${esc(user?.name||"Profile photo")}" loading="lazy">`:defaultAvatarSvg()}</div>`;
}
// Returning-user storage may contain either the local 9-digit Gambian number
// or the full +220 international number. Always send the local 9 digits to
// the PIN-login endpoint.
function localGambianPhone(value){
  const digits=String(value||"").replace(/\D/g,"");
  return digits.length>=9 ? digits.slice(-9) : digits;
}
function toast(msg, type=""){
  const root = document.getElementById("toast-root");
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 2600);
}

function showFriendlyErrorCard(title, message, actions="close"){
  const footer=actions==="account-exists"
    ? '<button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="go-login">Go to Sign In</button>'
    : '<button class="btn btn-primary" data-action="close-modal">Close</button>';
  showModal(title,`<div class="error-card"><div class="error-icon">!</div><div><h4>${esc(title)}</h4><p>${esc(message)}</p></div></div>`,footer);
}
async function detectBiometricSupport(){
  try{
    if(!window.PublicKeyCredential) return {supported:false,reason:"This browser does not support device passkeys."};
    if(typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable!=="function") return {supported:true,reason:"Secure device verification is available. Your phone will choose the available method."};
    const available=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    return available?{supported:true,reason:"Fingerprint/face unlock can be used through your device's secure passkey prompt."}:{supported:true,reason:"Passkeys are supported. Your device may use a secure PIN or another passkey method."};
  }catch{return {supported:false,reason:"We couldn't check this device's security capability yet."};}
}


async function getPasskeyClient(withSession=false){
  const cfg = await api("/api/config/public", {headers:{"Content-Type":"application/json"}});
  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error("Supabase public Auth configuration is unavailable.");
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm");
  const client=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{experimental:{passkey:true},persistSession:false,autoRefreshToken:false}});
  if(withSession){
    if(!state.token || !state.refreshToken) throw new Error("Your EcoStream session is not available.");
    const {error}=await client.auth.setSession({access_token:state.token,refresh_token:state.refreshToken});
    if(error) throw error;
  }
  return client;
}
async function signInWithPasskey(){
  try{
    if(!window.PublicKeyCredential) throw new Error("This device or browser does not support passkeys.");
    const client=await getPasskeyClient(false);
    const {data,error}=await client.auth.signInWithPasskey();
    if(error) throw error;
    const res=await fetch(CONFIG.apiBase+"/api/auth/profile",{headers:{"Content-Type":"application/json","Authorization":"Bearer "+data.session.access_token}});
    const profile=await res.json();
    if(!res.ok) throw new Error(profile.error||"Could not load your EcoStream profile.");
    setAuth(data.session.access_token,data.session.refresh_token,profile.user);
    state.view="dashboard"; toast("Biometric sign-in successful","success"); render();
  }catch(err){ showFriendlyErrorCard("Biometric sign-in could not be completed",err.message||"Try again or use your PIN."); }
}
async function listMyPasskeys(){
  const client=await getPasskeyClient(true);
  const {data,error}=await client.auth.passkey.list();
  if(error) throw error;
  state.biometricPasskeys=Array.isArray(data)?data:[];
  return state.biometricPasskeys;
}
async function registerPasskey({fromRegistration=false}={}){
  try{
    const info=await detectBiometricSupport();
    if(!info.supported) throw new Error(info.reason);
    const client=await getPasskeyClient(true);
    const {data,error}=await client.auth.registerPasskey();
    if(error) throw error;
    state.biometricPasskeys=[...(state.biometricPasskeys||[]),data].filter(Boolean);
    toast(fromRegistration?"Biometrics enabled. Your device is ready for secure sign-in.":"Biometric sign-in enabled.","success");
    return true;
  }catch(err){
    showFriendlyErrorCard(fromRegistration?"Biometric setup was not completed":"Biometric setup unavailable",err.message||"You can enable it again from Profile.");
    return false;
  }
}
async function setBiometricEnabled(enabled){
  const input=document.getElementById("profile-biometric-toggle");
  if(input) input.disabled=true;
  try{
    if(enabled){
      const ok=await registerPasskey();
      if(!ok) throw new Error("Biometric enrollment was not completed.");
    }else{
      const client=await getPasskeyClient(true);
      const keys=await listMyPasskeys();
      if(!keys.length){ toast("Biometrics is already disabled.","success"); return; }
      if(!confirm("Disable biometric sign-in on this EcoStream account? This removes the registered passkeys. You can enable it again later.")){ if(input) input.checked=true; return; }
      for(const key of keys){ const {error}=await client.auth.passkey.delete({passkeyId:key.id}); if(error) throw error; }
      state.biometricPasskeys=[];
      toast("Biometric sign-in disabled.","success");
    }
  }catch(err){
    if(input) input.checked=!enabled;
    showFriendlyErrorCard("Biometric setting was not changed",err.message||"Please try again.");
  }finally{
    if(input) input.disabled=false;
    refreshProfileBiometricSetting();
  }
}
async function refreshProfileBiometricSetting(){
  const input=document.getElementById("profile-biometric-toggle");
  const stateEl=document.getElementById("profile-biometric-state");
  if(!input||!stateEl) return;
  try{
    const info=await detectBiometricSupport();
    if(!info.supported){ input.disabled=true; stateEl.textContent=info.reason; return; }
    const keys=await listMyPasskeys();
    input.checked=keys.length>0; input.disabled=false;
    stateEl.textContent=keys.length?keys.length+" secure passkey"+(keys.length===1?"":"s")+" registered on your account.":"No biometric passkey is registered on this account.";
  }catch(err){ input.disabled=true; stateEl.textContent="Biometric status could not be checked right now."; }
}

function setAvailability(id,stateName,text){
  const el=document.getElementById(id); if(!el) return;
  el.hidden=false; el.className="availability "+stateName;
  el.innerHTML='<span class="dot"></span><span>'+esc(text)+'</span>';
}
async function checkRegistrationAvailability(){
  const nameEl=document.getElementById("registration-name");
  const phoneEl=document.querySelector('[data-form="register"] input[name="phone"]');
  if(!nameEl||!phoneEl) return;
  const name=String(nameEl.value||"").trim().replace(/\s+/g," ");
  const phone=String(phoneEl.value||"").replace(/\D/g,"");
  if(name.length>=2) setAvailability("registration-name-status","checking","Checking name…"); else document.getElementById("registration-name-status")?.setAttribute("hidden","");
  if(phone.length===9) setAvailability("registration-phone-status","checking","Checking mobile number…"); else document.getElementById("registration-phone-status")?.setAttribute("hidden","");
  if(name.length<2&&phone.length!==9) return;
  try{
    const p=new URLSearchParams(); if(name.length>=2)p.set("name",name); if(phone.length===9)p.set("phone",phone);
    const result=await api("/api/auth/availability?"+p.toString(),{method:"GET"});
    if(result.name?.checked)setAvailability("registration-name-status",result.name.available?"available":"taken",result.name.available?"✓ Name is available":"✕ Name is taken");
    if(result.phone?.checked)setAvailability("registration-phone-status",result.phone.available?"available":"taken",result.phone.available?"✓ Mobile number is available":"✕ Mobile number is already registered");
  }catch{}
}
function scheduleRegistrationAvailability(){clearTimeout(state.registrationAvailabilityTimer);state.registrationAvailabilityTimer=setTimeout(checkRegistrationAvailability,420);}
/* ---------- API layer ---------- */
async function api(path, opts={}){
  const headers = { "Content-Type":"application/json", ...(opts.headers||{}) };
  const publicAuthPath = ["/api/auth/login","/api/auth/register","/api/auth/forgot-pin","/api/auth/refresh","/api/auth/availability"].includes(path);
  if(state.token && !publicAuthPath) headers["Authorization"] = "Bearer " + state.token;
  let res;
  const controller = new AbortController();
  const requestTimeout = setTimeout(() => controller.abort(), 20000);
  try{
    res = await fetch(CONFIG.apiBase + path, { ...opts, headers, signal: controller.signal });
  }catch(e){
    if(e?.name === "AbortError"){
      toast("Sign-in is taking too long. Please try again in a moment.", "error");
      throw new Error("The EcoStream authentication service timed out. Please try again.");
    }
    toast("Can't reach the EcoStream server at " + CONFIG.apiBase + ". Please check your connection and try again.", "error");
    throw e;
  }finally{
    clearTimeout(requestTimeout);
  }
  let data = {};
  try{ data = await res.json(); }catch{ /* no body */ }

  if(res.status === 401 && !publicAuthPath && !opts._retried && state.refreshToken){
    // Access token expired — try a silent refresh once before giving up.
    // This is what makes the refresh token actually useful day-to-day:
    // without it, users would need to log in again every 12h even though
    // a valid refresh token exists.
    const refreshed = await trySilentRefresh();
    if(refreshed) return api(path, { ...opts, _retried: true });
  }
  if(res.status === 401){
    if(publicAuthPath){const message=data.error||data.message||"Authentication request was rejected.";showFriendlyErrorCard("Sign-in could not be completed",message);throw new Error(message);}
    logout(false); showFriendlyErrorCard("Your session has ended","For your security, please sign in again."); throw new Error("unauthorized");
  }
  if(res.status===409){
    const message=data.error||"This information is already registered.";
    if(path==="/api/auth/register"&&/phone number|phone/i.test(message))showFriendlyErrorCard("Account already exists","This mobile number is already linked to an EcoStream account. Would you like to sign in instead?","account-exists");
    else showFriendlyErrorCard("Registration details already used",message);
    throw new Error(message);
  }
  if(!res.ok){showFriendlyErrorCard("Request could not be completed",data.error||"Something went wrong. Please try again.");throw new Error(data.error||String(res.status));}
  return data;
}

async function trySilentRefresh(){
  try{
    const res = await fetch(CONFIG.apiBase + "/api/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refreshToken: state.refreshToken }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    state.token = data.token; state.refreshToken = data.refreshToken;
    localStorage.setItem("eco_token", data.token);
    localStorage.setItem("eco_refresh_token", data.refreshToken);
    return true;
  }catch{ return false; }
}

function setAuth(token, refreshToken, user){
  state.token = token; state.refreshToken = refreshToken; state.user = user;
  localStorage.setItem("eco_token", token);
  if(refreshToken) localStorage.setItem("eco_refresh_token", refreshToken);
  localStorage.setItem("eco_user", JSON.stringify(user));
  if(user?.phone) localStorage.setItem("eco_returning_phone", localGambianPhone(user.phone));
}
async function logout(redirect=true){
  const accessToken = state.token;
  const refreshToken = state.refreshToken;
  // Revoke the current Supabase session before clearing local credentials.
  if(accessToken){
    try{
      await fetch(CONFIG.apiBase + "/api/auth/logout", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
        body:JSON.stringify({refreshToken})
      });
    }catch{}
  }
  state.token = null; state.refreshToken = null; state.user = null;
  localStorage.removeItem("eco_token"); localStorage.removeItem("eco_refresh_token"); localStorage.removeItem("eco_user");
  if(state.chatPoll) clearInterval(state.chatPoll);
  state.authMode = localStorage.getItem("eco_returning_phone") ? "returning" : "login";
  if(redirect){ state.view="dashboard"; render(); }
}

/* ---------- theme ---------- */
function initTheme(){
  const saved = localStorage.getItem("eco_theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("eco_theme", next);
  render();
}

/* ---------- gauge (signature element) ---------- */
function gauge(depth, total, size=84){
  const pct = total>0 ? Math.min(100, Math.round(depth/total*100)) : 0;
  const r = 36, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const complete = pct>=100;
  return `<div class="gauge" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 84 84">
      <circle class="track" cx="42" cy="42" r="${r}"></circle>
      <circle class="fill ${complete?'complete':''}" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>
    <div class="gauge-label"><b>${pct}%</b><span>${depth}/${total}m</span></div>
  </div>`;
}

function statusBadge(status){
  const map = {
    pending:["badge-amber","Pending"], approved:["badge-blue","Approved"],
    ongoing:["badge-blue","Ongoing"], "in-progress":["badge-blue","In Progress"],
    completed:["badge-green","Completed"], rejected:["badge-red","Rejected"],
    paid:["badge-green","Paid"], open:["badge-amber","Open"],
    "in progress":["badge-blue","In Progress"], resolved:["badge-green","Resolved"],
    suspended:["badge-red","Suspended"], active:["badge-green","Active"],
  };
  const [cls,label] = map[status] || ["badge-grey", status||"—"];
  return `<span class="badge ${cls}">${label}</span>`;
}

/* ============================================================
   AUTH VIEWS
   ============================================================ */
function renderAuth(){
  const mode = state.authMode;
  const tabs = mode!=="reset" && mode!=="verify-phone" ? '<div class="auth-tabs"><button data-action="auth-tab" data-mode="returning" class="'+(mode==='returning'?'active':'')+'">Returning User</button><button data-action="auth-tab" data-mode="login" class="'+(mode==='login'||mode==='forgot'?'active':'')+'">Use Another Account</button><button data-action="auth-tab" data-mode="register" class="'+(mode==='register'?'active':'')+'">Create Account</button></div>' : '';
  app.innerHTML = `
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="mark" style="background:#fff;padding:4px;"><img src="/portal/assets/ecostream-logo.svg" alt="EcoStream" style="width:100%;height:100%;object-fit:contain;"></div>
        <h1>EcoStream</h1>
        <p>Smart Borehole Operations</p>
      </div>
      ${tabs}
      <div class="auth-card">
        ${mode==="returning" ? authReturningForm() : ""}${mode==="login" ? authLoginForm() : ""}
        ${mode==="register" ? authRegisterForm() : ""}
        ${mode==="forgot" ? authForgotForm() : ""}
        ${mode==="reset" ? authResetForm() : ""}
        ${mode==="verify-phone" ? authVerifyPhoneForm() : ""}
      </div>
      <div class="auth-security">
        <div class="auth-security-title">🛡️ EcoStream Staff Access</div>
        <div class="auth-security-copy">Restricted area · Authorized EcoStream staff and administrators only.</div>
        <a class="admin-access" href="/admin/" rel="noopener">🛡️ Staff / Admin Portal <span>↗</span></a>
      </div>
      <div class="auth-foot">EcoStream Ltd · +220 380 6666<br><span>Powered by Royal Fintech</span></div>
    </div>
  </div>`;
  if(mode==="register") setTimeout(bindRegistrationSecurity,0);
}
function phoneField(name="phone", value="87"){
  return `<div class="field"><label>Gambian Mobile Number</label>
    <div class="phone-control"><span class="phone-country">🇬🇲 +220</span><input name="${name}" value="${esc(value || "87")}" required inputmode="numeric" autocomplete="tel" maxlength="9" pattern="[0-9]{9}" placeholder="87 ••• ••• 7" aria-label="Gambian phone number"></div>
    <div class="field-hint">Enter the 9-digit number after +220.</div>
  </div>`;
}
function pinField(name="pin", label="6-Digit PIN", autocomplete="current-password"){
  return `<div class="field"><label>${label}</label><input type="password" name="${name}" required inputmode="numeric" autocomplete="${autocomplete}" minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="••••••"></div>`;
}
function authReturningForm(){
  const remembered=String(localStorage.getItem("eco_returning_phone")||"").replace(/\D/g,"");
  const masked=remembered.length>=4?"•••• "+remembered.slice(-4):"This device";
  return `
  <div class="returning-card">
    <div style="font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--green);">Welcome back</div>
    <h2 style="margin:6px 0 7px;">Return to EcoStream</h2>
    <p style="font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:16px;">This device remembers your EcoStream account. Sign in with your PIN, or use your device biometrics.</p>
    <div class="returning-account"><div class="mini-avatar">E</div><div><b>EcoStream account</b><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Mobile ending ${masked}</div></div></div>
    <form data-form="returning">
      <input type="hidden" name="phone" value="${esc(remembered)}">
      <div class="field"><label>6-Digit PIN</label><input type="password" name="pin" required inputmode="numeric" autocomplete="current-password" minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="••••••"></div>
      <button class="btn btn-primary btn-block" type="submit">Sign In with PIN</button>
    </form>
    <div class="returning-actions">
      <button class="btn btn-outline btn-block" type="button" data-action="passkey-login">🔐 Use Biometrics / Passkey</button>
      <button class="btn btn-ghost btn-block" type="button" data-action="auth-tab" data-mode="login">Use another account</button>
    </div>
  </div>`;
}
function authLoginForm(){
  return `
  <form data-form="login">
    ${phoneField()}
    ${pinField()}

let ecoPromoTimer=null;
let ecoPromoIndex=0;
function showEcoPromo(index){
  const root=document.getElementById("eco-promo-carousel");if(!root)return;
  const slides=[...root.querySelectorAll("[data-promo-slide]")];if(!slides.length)return;
  ecoPromoIndex=(index+slides.length)%slides.length;
  slides.forEach((slide,i)=>{const active=i===ecoPromoIndex;slide.classList.toggle("is-active",active);slide.setAttribute("aria-hidden",active?"false":"true");});
  root.querySelectorAll(".eco-promo-dot").forEach((dot,i)=>{const active=i===ecoPromoIndex;dot.classList.toggle("is-active",active);dot.setAttribute("aria-pressed",active?"true":"false");});
}
function startEcoPromoCarousel(){
  if(ecoPromoTimer)clearInterval(ecoPromoTimer);
  ecoPromoIndex=0;showEcoPromo(0);
  ecoPromoTimer=setInterval(()=>{if(document.hidden)return;showEcoPromo(ecoPromoIndex+1);},3000);
}
function stopEcoPromoCarousel(){if(ecoPromoTimer){clearInterval(ecoPromoTimer);ecoPromoTimer=null;}}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title, body, footer){
  const existing = document.getElementById("modal-root");
  if(existing) existing.remove();
  const wrap = document.createElement("div");
  wrap.id = "modal-root";
  wrap.className = "modal-overlay";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-header"><b style="font-size:16px;">${title}</b><button class="icon-btn" data-action="close-modal" style="width:30px;height:30px;">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer? `<div class="modal-footer">${footer}</div>`:""}
  </div>`;
  wrap.addEventListener("click", e=>{ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
  enhanceSecretFields(wrap);
}
function closeModal(){ const m=document.getElementById("modal-root"); if(m) m.remove(); }

  dashboard: loadDashboard, book: loadBook, projects: loadProjects,
  invoices: loadInvoices, documents: loadDocuments, support: loadSupport,
  chat: loadChat, notifications: loadNotifications, profile: loadProfile,
};
function enhanceSecretFields(root=document){
   root.querySelectorAll('input[type="password"]').forEach((input)=>{
     if(input.dataset.secretEnhanced) return;
     input.dataset.secretEnhanced="1";
     const wrap=document.createElement("div");
     wrap.className="secret-field";
     input.parentNode.insertBefore(wrap,input);
     wrap.appendChild(input);
     const btn=document.createElement("button");
     btn.type="button"; btn.className="secret-toggle"; btn.dataset.action="toggle-secret";
     btn.setAttribute("aria-label","Show password"); btn.title="Show password"; btn.textContent="👁️";
     wrap.appendChild(btn);
   });
 }
 function render(){
  if(state.chatPoll){ clearInterval(state.chatPoll); state.chatPoll=null; }
  if(!state.token || !state.user){ renderAuth(); enhanceSecretFields(); return; }
  const loader = LOADERS[state.view] || loadDashboard;
  loader();
}

    }
    return;
  }
  if(action==="get-location"){
    const details=document.getElementById("booking-location-details");

    if(status) status.textContent="Requesting location…";
    navigator.geolocation.getCurrentPosition((pos)=>{
      const lat=pos.coords.latitude.toFixed(7), lng=pos.coords.longitude.toFixed(7);
      const set=(id,val)=>{const el=document.getElementById(id);if(el)el.value=val;};
      set("booking-latitude",lat); set("booking-longitude",lng); set("booking-gps-accuracy",Math.round(pos.coords.accuracy));

      if(status) status.textContent=`GPS captured ±${Math.round(pos.coords.accuracy)}m`;
      toast("Current location captured","success");
    },()=>{ if(status) status.textContent="Location permission was not granted"; toast("Please allow location access or enter coordinates manually","error"); },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});

    }

  if(action==="view-invoice"){ openInvoice(t.dataset.id); return; }
  if(action==="view-service-invoice"){ openServiceInvoice(t.dataset.id); return; }
  if(action==="print-invoice"){ window.print(); return; }
  if(action==="open-ticket"){ openTicket(t.dataset.id); return; }

  if(action==="mark-read"){
    try{ await api("/api/notifications/"+t.dataset.id+"/read", {method:"PATCH"}); loadNotifications(); }catch{}
    return;
  }
  if(action==="edit-profile"){ editProfileModal(); return; }
  if(action==="revoke-session"){
    try{ await api("/api/auth/sessions/"+t.dataset.id, {method:"DELETE"}); toast("Device signed out","success"); loadSessionsInto("sessions-panel"); }catch{}
    return;
  }
  if(action==="revoke-all-sessions"){
    if(!confirm("Sign out of all devices? You'll need to log in again here too.")) return;
    try{ await api("/api/auth/sessions", {method:"DELETE"}); toast("Signed out everywhere","success"); logout(); }catch{}
    return;
  }
  
  if(action==="pick-file"){ document.getElementById("file-input").click(); return; }
  if(action==="download-doc"){
    try{
      const { document: doc } = await api("/api/documents/"+t.dataset.id);

});

document.addEventListener("change", (e)=>{

      const canvas=document.createElement("canvas"),max=320,scale=Math.min(1,max/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
      const ctx=canvas.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
      let avatarUrl=canvas.toDataURL("image/jpeg",.78);if(avatarUrl.length>240000)avatarUrl=canvas.toDataURL("image/jpeg",.58);if(avatarUrl.length>250000){toast("This image is still too large after compression. Choose another photo.","error");return;}
      try{const result=await api("/api/auth/profile",{method:"PUT",body:JSON.stringify({avatarUrl})});state.user={...state.user,...(result.user||{}),avatarUrl};localStorage.setItem("eco_user",JSON.stringify(state.user));toast("Profile photo updated successfully.","success");loadProfile();}

  if(e.target.id === "file-input"){

document.addEventListener("submit", async (e)=>{
  const form = e.target.closest("[data-form]");
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());
  const wantsBiometric=kind==="register"&&data.biometricOptIn==="yes"; delete data.biometricOptIn;
  if (data.phone) data.phone = String(data.phone).replace(/\D/g, "");
  if (data.latitudeDisplay) data.latitude = data.latitudeDisplay;
  if (data.longitudeDisplay) data.longitude = data.longitudeDisplay;
  delete data.latitudeDisplay; delete data.longitudeDisplay;
  const submitBtn = form.querySelector("button[type=submit]");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.dataset.origText = submitBtn.textContent; submitBtn.textContent = "Please wait…"; }

  try{
    if(kind==="returning"){
      const remembered=localGambianPhone(localStorage.getItem("eco_returning_phone")||data.phone||"");
      if(remembered.length!==9) throw new Error("This device has no valid remembered EcoStream phone number. Choose Use Another Account and enter your number.");
      data.phone=remembered;
      const res=await api("/api/auth/login",{method:"POST",body:JSON.stringify(data)});
      setAuth(res.token,res.refreshToken,res.user); state.view="dashboard"; toast("Welcome back, "+res.user.name+"!","success"); render();
    }
    else if(kind==="login"){
      const res = await api("/api/auth/login", { method:"POST", body: JSON.stringify(data) });
      setAuth(res.token, res.refreshToken, res.user); state.view="dashboard"; toast("Welcome back, "+res.user.name+"!", "success"); render();
    }
    else if(kind==="register"){
      const res = await api("/api/auth/register", { method:"POST", body: JSON.stringify(data) });
      setAuth(res.token, res.refreshToken, res.user); state.view="dashboard"; toast("Account created — welcome to EcoStream!","success"); render(); if(wantsBiometric) await registerPasskey({fromRegistration:true});
    }
    else if(kind==="forgot"){
      const res = await api("/api/auth/forgot-pin", { method:"POST", body: JSON.stringify(data) });
      toast(res.message, "success");
      
      state.authMode = "reset"; renderAuth();
    }
    else if(kind==="reset"){
      await api("/api/auth/reset-password", { method:"POST", body: JSON.stringify(data) });
      toast("PIN updated — please sign in.", "success");
      state.authMode = "login"; renderAuth();
    }
    else if(kind==="service-invoice-schedule"){
      const result=await api("/api/service-invoices/"+form.dataset.id+"/schedule",{method:"PUT",body:JSON.stringify(data)});
      toast(result.message||"Appointment request sent to EcoStream","success");closeModal();loadInvoices();
    }
    else if(kind==="booking"){
      const result = await api("/api/bookings", { method:"POST", body: JSON.stringify(data) });
      toast(result.message || "Thank you. Your request has been received, and our team will contact you about the next steps.", "success");
      state.view="dashboard"; render();
    }
    else if(kind==="ticket"){
      await api("/api/tickets", { method:"POST", body: JSON.stringify(data) });
      toast("Ticket submitted", "success");
      closeModal(); loadSupport();
    }
    else if(kind==="chat"){
      form.reset();
      await api("/api/chat/me", { method:"POST", body: JSON.stringify(data) });
      refreshChat();
    }
    else if(kind==="edit-profile"){
      const res = await api("/api/auth/profile", { method:"PUT", body: JSON.stringify(data) });
      state.user = res.user; localStorage.setItem("eco_user", JSON.stringify(res.user));
      toast("Profile updated", "success"); closeModal(); loadProfile();
    }
  }catch(err){
    // Validation failures can happen before api() runs; never swallow them
    // silently or leave returning users thinking the button did nothing.
    const message=String(err?.message||"Sign-in could not be completed. Please try again.");
    if(!/Request could not be completed|Sign-in could not be completed|Registration details already used|Account already exists/.test(message)) toast(message,"error");
  }
  finally{
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = submitBtn.dataset.origText; }
  }
});

function bindRegistrationSecurity(){
  const form=document.querySelector('[data-form="register"]'); if(!form||form.dataset.securityBound)return; form.dataset.securityBound="1";
  document.getElementById("registration-name")?.addEventListener("input",scheduleRegistrationAvailability);
  form.querySelector('input[name="phone"]')?.addEventListener("input",scheduleRegistrationAvailability);
  document.getElementById("registration-biometric")?.addEventListener("change",async e=>{if(e.target.checked){const info=await detectBiometricSupport();if(!info.supported){e.target.checked=false;showFriendlyErrorCard("Biometrics not available",info.reason);}}});
  detectBiometricSupport().then(info=>{const el=document.getElementById("registration-biometric-status");if(el)el.textContent=info.reason;});
}

/* ---------- init ---------- */
initTheme();
render();

})();
</script>
</body>
