<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoStream — Client Portal</title>
<link rel="icon" type="image/png" href="assets/ecostream-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ECOSTREAM CLIENT PORTAL — design tokens
   Palette: deep water-green + blue (water) + warm sand + charcoal
   Display face: Fraunces (characterful serif for headings)
   Body/UI face: Inter
   Signature element: circular "depth gauge" — a borehole-specific
   progress ring used for drilling/water-yield tracking, standing
   in for the generic linear progress bar you'd see elsewhere.
   ============================================================ */
:root{
  --green:#0B8F4D; --green-dark:#064D28; --green-deepest:#052E18;
  --blue:#1565C0; --blue-light:#E8F2FC;
  --sand:#F6F8F5; --sand-deep:#ECF1EC;
  --charcoal:#16211B; --charcoal-soft:#3A4A42;
  --amber:#F0932B; --amber-light:#FDF1E4;
  --red:#D6534A; --red-light:#FBEAE8;
  --card:#FFFFFF; --border:#E1E8E3; --text:#182620; --text-muted:#5B6E64; --text-faint:#8FA298;
  --glass:rgba(255,255,255,.66); --glass-border:rgba(255,255,255,.5);
  --radius:18px; --radius-sm:12px;
  --shadow-soft:0 8px 30px rgba(10,40,25,.08);
  --shadow-lift:0 16px 44px rgba(10,40,25,.14);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
html[data-theme="dark"]{
  --sand:#0D1712; --sand-deep:#0A130F;
  --card:#152019; --border:#25342B; --text:#EAF2EC; --text-muted:#9CB0A5; --text-faint:#5F756A;
  --glass:rgba(21,32,25,.6); --glass-border:rgba(255,255,255,.08);
  --blue-light:#132A44; --amber-light:#3A2A10; --red-light:#3A1414;
  --shadow-soft:0 8px 30px rgba(0,0,0,.35); --shadow-lift:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body); background:var(--sand); color:var(--text);
  transition:background .25s ease, color .25s ease;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display);}
a{color:inherit;}
button,input,select,textarea{font-family:inherit; font-size:14px;}
button{cursor:pointer;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes ripple{0%{stroke-dashoffset:283;} 100%{stroke-dashoffset:var(--target-offset);}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

.view{animation:fadeUp .35s ease both;}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:12px; border:1.5px solid transparent; font-weight:600; font-size:14px; transition:transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 6px 18px rgba(11,143,77,.28);}
.btn-primary:hover{background:var(--green-dark);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--green); color:var(--green);}
.btn-danger{background:var(--red); color:#fff;}
.btn-ghost{background:rgba(255,255,255,.12); color:#fff; border:none;}
.btn-sm{padding:7px 14px; font-size:12.5px; border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55; cursor:not-allowed;}

/* ---------- forms ---------- */
.field{margin-bottom:16px; text-align:left;}
.field label{display:block; font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--border); background:var(--card); color:var(--text);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(11,143,77,.12);}
.field textarea{min-height:96px; resize:vertical;}
.field-error{color:var(--red); font-size:12px; margin-top:5px; font-weight:600;}
.field-hint{color:var(--text-faint); font-size:12px; margin-top:5px;}

/* ---------- glass / cards ---------- */
.glass{background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border);}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-soft); transition:transform .18s ease, box-shadow .18s ease;}
.card-hover:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift);}
.card-pad{padding:20px;}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; letter-spacing:.02em; padding:4px 11px; border-radius:99px; text-transform:uppercase;}
.badge-green{background:#E4F5EC; color:var(--green-dark);}
.badge-blue{background:var(--blue-light); color:var(--blue);}
.badge-amber{background:var(--amber-light); color:var(--amber);}
.badge-red{background:var(--red-light); color:var(--red);}
.badge-grey{background:var(--sand-deep); color:var(--text-muted);}
html[data-theme="dark"] .badge-green{background:#0F3323;}

/* ---------- depth gauge (signature element) ---------- */
.gauge{position:relative; width:84px; height:84px; flex-shrink:0;}
.gauge svg{transform:rotate(-90deg);}
.gauge circle{fill:none; stroke-width:8;}
.gauge .track{stroke:var(--sand-deep);}
.gauge .fill{stroke:var(--blue); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.gauge .fill.complete{stroke:var(--green);}
.gauge-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.gauge-label b{font-size:16px; line-height:1;}
.gauge-label span{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}

/* ---------- toasts ---------- */
#toast-root{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--charcoal); color:#fff; padding:12px 20px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:fadeUp .25s ease;}
.toast.error{background:var(--red);}
.toast.success{background:var(--green-dark);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(10,20,15,.55); backdrop-filter:blur(3px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .2s ease;}
.modal{background:var(--card); border-radius:20px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lift); animation:fadeUp .25s ease;}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-body{padding:22px;}
.modal-footer{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

/* ---------- official EcoStream branding ---------- */
.logo-plate{width:42px;height:42px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.16);overflow:hidden;}
.logo-plate img{display:block;width:100%;height:100%;object-fit:contain;}
.auth-logo .logo-plate{width:96px;height:89px;border-radius:22px;padding:7px;box-shadow:0 18px 42px rgba(0,0,0,.28);}
.brand .logo-plate{width:48px;height:48px;border-radius:13px;padding:4px;}
.mobile-brand{display:none;align-items:center;justify-content:center;width:104px;height:38px;border-radius:10px;background:rgba(255,255,255,.92);padding:3px;box-shadow:0 5px 16px rgba(0,0,0,.08);overflow:hidden;}
.mobile-brand img{width:100%;height:100%;object-fit:contain;}

/* ---------- layout: auth ---------- */
.auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(circle at 20% 15%, var(--green-dark), var(--green-deepest) 60%);}
.auth-box{width:100%; max-width:420px;}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; color:#fff; text-align:center;}
.auth-logo .mark{width:60px; height:60px; border-radius:16px; background:linear-gradient(135deg,var(--green),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:28px;}
.auth-logo h1{font-size:24px; letter-spacing:.02em;}
.auth-logo p{font-size:12px; color:rgba(255,255,255,.55); text-transform:uppercase; letter-spacing:.12em; font-weight:700;}
.auth-tabs{display:flex; gap:6px; background:rgba(255,255,255,.1); padding:4px; border-radius:14px; margin-bottom:18px;}
.auth-tabs button{flex:1; padding:10px 0; border:none; background:transparent; color:rgba(255,255,255,.6); font-weight:700; font-size:13px; border-radius:10px;}
.auth-tabs button.active{background:#fff; color:var(--green-dark);}
.auth-card{background:#fff; border-radius:20px; padding:26px; box-shadow:0 30px 70px rgba(0,0,0,.35);}
.auth-foot{text-align:center; margin-top:16px; color:rgba(255,255,255,.5); font-size:12px;}
.auth-link{background:none; border:none; color:#fff; font-weight:700; text-decoration:underline; cursor:pointer; font-size:13px;}

/* ---------- layout: app shell ---------- */
.app-shell{min-height:100vh; display:flex;}
.sidebar{width:230px; background:var(--charcoal); color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:200;}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:22px 20px; border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand .mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--green),var(--blue)); display:flex; align-items:center; justify-content:center; font-size:16px;}
.sidebar .brand b{font-size:15px;}
.sidebar .brand span{display:block; font-size:9px; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.1em;}
.nav-list{flex:1; overflow-y:auto; padding:14px 12px;}
.nav-item{display:flex; align-items:center; gap:12px; width:100%; padding:11px 14px; border-radius:11px; background:transparent; border:none; color:rgba(255,255,255,.62); font-size:13.5px; font-weight:600; margin-bottom:2px; text-align:left; transition:background .15s ease, color .15s ease;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(135deg, var(--green), var(--green-dark)); color:#fff;}
.nav-item .ic{width:18px; text-align:center; font-size:15px;}
.sidebar-foot{padding:14px; border-top:1px solid rgba(255,255,255,.08);}

.main{flex:1; margin-left:230px; display:flex; flex-direction:column; min-height:100vh;}
.topbar{position:sticky; top:0; z-index:150; display:flex; align-items:center; gap:14px; padding:14px 28px; background:var(--glass); backdrop-filter:blur(14px); border-bottom:1px solid var(--border);}
.topbar h2{font-size:18px;}
.topbar .spacer{flex:1;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:16px; position:relative; color:var(--text);}
.icon-btn .dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--red); border:2px solid var(--card);}
.content{padding:26px 28px 90px; flex:1;}

.mobile-nav{display:none;}
.hamburger{display:none;}

@media (max-width: 880px){
  .sidebar{transform:translateX(-100%); transition:transform .25s ease; width:250px;}
  .sidebar.open{transform:translateX(0); box-shadow:20px 0 50px rgba(0,0,0,.3);}
  .main{margin-left:0;}
  .hamburger{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card); font-size:18px;}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190;}
  .sidebar-scrim.show{display:block;}
  .content{padding:18px 16px 100px;}
  .topbar{padding:12px 16px;}
}


@media (max-width:560px){
  .auth-screen{padding:16px;}
  .auth-box{max-width:420px;}
  .auth-card{padding:20px;}
  .auth-logo{margin-bottom:20px;}
  .auth-logo .logo-plate{width:84px;height:78px;border-radius:19px;}
  .mobile-brand{display:flex;}
  .topbar h2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
}

/* ---------- grids & misc ---------- */
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:700px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }
.stat-card{padding:18px; border-radius:16px; background:var(--card); border:1px solid var(--border);}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:700;}
.stat-card .lbl{font-size:12px; color:var(--text-muted); margin-top:4px;}
.empty{text-align:center; padding:50px 20px; color:var(--text-muted);}
.empty .ic{font-size:38px; margin-bottom:10px;}
.section-title{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:22px 0 10px;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:var(--sand-deep); font-size:12.5px; font-weight:600; border:1.5px solid transparent; cursor:pointer;}
.chip.active{background:var(--green); color:#fff;}
.list-item{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.avatar{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
.hero-band{background:linear-gradient(120deg, var(--green-dark), var(--green) 60%, var(--blue)); border-radius:22px; padding:26px; color:#fff; position:relative; overflow:hidden;}
.hero-band::after{content:""; position:absolute; right:-40px; bottom:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);}
.step-track{display:flex; gap:0; margin-bottom:22px;}
.step-track .step{flex:1; text-align:center; position:relative; font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.step-track .step::before{content:""; display:block; width:26px; height:26px; border-radius:50%; background:var(--sand-deep); margin:0 auto 6px; line-height:26px; color:var(--text-muted);}
.step-track .step.done::before{background:var(--green); }
.step-track .step.active::before{background:var(--blue);}
.chat-thread{display:flex; flex-direction:column; gap:10px; padding:6px 0;}
.chat-bubble{max-width:75%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.4;}
.chat-bubble.me{align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:4px;}
.chat-bubble.them{align-self:flex-start; background:var(--sand-deep); border-bottom-left-radius:4px;}
.chat-bubble .meta{display:block; font-size:10px; opacity:.65; margin-top:4px;}
.doc-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px;}
.doc-row .ic{font-size:20px;}
.upload-drop{border:2px dashed var(--border); border-radius:14px; padding:26px; text-align:center; color:var(--text-muted); cursor:pointer; transition:border-color .15s ease, background .15s ease;}
.upload-drop:hover{border-color:var(--green); background:var(--sand-deep);}
.skeleton{background:linear-gradient(90deg, var(--sand-deep) 25%, var(--border) 37%, var(--sand-deep) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}
</style>
</head>
<body>
<div id="toast-root"></div>
<div id="app"></div>
<script>
/* ============================================================
   ECOSTREAM CLIENT PORTAL — application logic
   Vanilla JS, no build step. Talks to the EcoStream API (Node,
   zero external deps) over fetch(). Views are template strings;
   a single delegated click/submit handler dispatches on
   data-action / data-form attributes instead of wiring one
   listener per element.
   ============================================================ */
(function(){
"use strict";

/* ---------- config & state ---------- */
const CONFIG = { apiBase: localStorage.getItem("eco_api_base") || "http://localhost:4000" };
const state = {
  token: localStorage.getItem("eco_token") || null,
  refreshToken: localStorage.getItem("eco_refresh_token") || null,
  user: JSON.parse(localStorage.getItem("eco_user") || "null"),
  view: "dashboard",
  authMode: "login", // login | register | forgot | reset
  cache: {}, // simple per-view data cache populated by loaders
  chatPoll: null,
};

const app = document.getElementById("app");

/* ---------- helpers ---------- */
function gmd(n){ return "GMD " + Number(n||0).toLocaleString(); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }catch{ return d; } }
function fmtDateTime(d){ try{ return new Date(d).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }catch{ return d; } }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function toast(msg, type=""){
  const root = document.getElementById("toast-root");
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 2600);
}

/* ---------- API layer ---------- */
async function api(path, opts={}){
  const headers = { "Content-Type":"application/json", ...(opts.headers||{}) };
  if(state.token) headers["Authorization"] = "Bearer " + state.token;
  let res;
  try{
    res = await fetch(CONFIG.apiBase + path, { ...opts, headers });
  }catch(e){
    toast("Can't reach the EcoStream server at " + CONFIG.apiBase + ". Is it running?", "error");
    throw e;
  }
  let data = {};
  try{ data = await res.json(); }catch{ /* no body */ }

  if(res.status === 401 && !opts._retried && state.refreshToken && path !== "/api/auth/refresh"){
    // Access token expired — try a silent refresh once before giving up.
    // This is what makes the refresh token actually useful day-to-day:
    // without it, users would need to log in again every 12h even though
    // a valid refresh token exists.
    const refreshed = await trySilentRefresh();
    if(refreshed) return api(path, { ...opts, _retried: true });
  }
  if(res.status === 401){
    logout(false);
    toast("Session expired — please log in again.", "error");
    throw new Error("unauthorized");
  }
  if(!res.ok){
    toast(data.error || "Something went wrong (" + res.status + ")", "error");
    throw new Error(data.error || String(res.status));
  }
  return data;
}

async function trySilentRefresh(){
  try{
    const res = await fetch(CONFIG.apiBase + "/api/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refreshToken: state.refreshToken }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    state.token = data.token; state.refreshToken = data.refreshToken;
    localStorage.setItem("eco_token", data.token);
    localStorage.setItem("eco_refresh_token", data.refreshToken);
    return true;
  }catch{ return false; }
}

function setAuth(token, refreshToken, user){
  state.token = token; state.refreshToken = refreshToken; state.user = user;
  localStorage.setItem("eco_token", token);
  if(refreshToken) localStorage.setItem("eco_refresh_token", refreshToken);
  localStorage.setItem("eco_user", JSON.stringify(user));
}
function logout(redirect=true){
  const refreshToken = state.refreshToken;
  state.token = null; state.refreshToken = null; state.user = null;
  localStorage.removeItem("eco_token"); localStorage.removeItem("eco_refresh_token"); localStorage.removeItem("eco_user");
  if(state.chatPoll) clearInterval(state.chatPoll);
  state.authMode = "login";
  if(refreshToken){
    // Best-effort — revoke the session server-side so signing out actually
    // invalidates the refresh token instead of just forgetting it locally.
    fetch(CONFIG.apiBase + "/api/auth/logout", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({refreshToken})
    }).catch(()=>{});
  }
  if(redirect){ state.view="dashboard"; render(); }
}

/* ---------- theme ---------- */
function initTheme(){
  const saved = localStorage.getItem("eco_theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("eco_theme", next);
  render();
}

/* ---------- gauge (signature element) ---------- */
function gauge(depth, total, size=84){
  const pct = total>0 ? Math.min(100, Math.round(depth/total*100)) : 0;
  const r = 36, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const complete = pct>=100;
  return `<div class="gauge" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 84 84">
      <circle class="track" cx="42" cy="42" r="${r}"></circle>
      <circle class="fill ${complete?'complete':''}" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>
    <div class="gauge-label"><b>${pct}%</b><span>${depth}/${total}m</span></div>
  </div>`;
}

function statusBadge(status){
  const map = {
    pending:["badge-amber","Pending"], approved:["badge-blue","Approved"],
    ongoing:["badge-blue","Ongoing"], "in-progress":["badge-blue","In Progress"],
    completed:["badge-green","Completed"], rejected:["badge-red","Rejected"],
    paid:["badge-green","Paid"], open:["badge-amber","Open"],
    "in progress":["badge-blue","In Progress"], resolved:["badge-green","Resolved"],
    suspended:["badge-red","Suspended"], active:["badge-green","Active"],
  };
  const [cls,label] = map[status] || ["badge-grey", status||"—"];
  return `<span class="badge ${cls}">${label}</span>`;
}

   ============================================================ */
async function loadChat(){
  renderShell(`<div id="chat-container">${loadingSkeleton()}</div>`, "Chat with Company");
  await refreshChat();
  state.chatPoll = setInterval(refreshChat, 4000);
}
async function refreshChat(){
  try{
    const { messages } = await api("/api/chat/me");
    const el = document.getElementById("chat-container");
    if(!el) return; // navigated away
    el.innerHTML = chatHtml(messages);
    const thread = document.getElementById("chat-thread");
    if(thread) thread.scrollTop = thread.scrollHeight;
  }catch(e){}
}
function chatHtml(messages){
  return `
  <div class="card" style="display:flex;flex-direction:column;height:calc(100vh - 230px);max-height:560px;">
    <div class="chat-thread" id="chat-thread" style="flex:1;overflow-y:auto;padding:18px;">
      ${!messages.length ? `<div class="empty"><div class="ic">💬</div>Say hello — our team typically replies within a few hours.</div>` :
      messages.map(m=>`<div class="chat-bubble ${m.sender==='client'?'me':'them'}">${esc(m.message)}<span class="meta">${m.sender==='client'?'You':esc(m.senderName)} · ${fmtDateTime(m.createdAt)}</span></div>`).join("")}
    </div>
    <form data-form="chat" style="display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);">
      <input name="message" placeholder="Type a message…" required style="flex:1;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);color:var(--text);">
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>`;
}

/* ============================================================
   VIEW: NOTIFICATIONS
   ============================================================ */
async function loadNotifications(){
  renderShell(loadingSkeleton(), "Notifications");
  try{
    const { notifications } = await api("/api/notifications");
    state.cache.unreadCount = notifications.filter(n=>!n.read).length;
    renderShell(notificationsHtml(notifications), "Notifications");
  }catch(e){ renderShell(errorState("Couldn't load notifications."), "Notifications"); }
}
const NOTIF_ICONS = { payment:"💳", maintenance:"🔧", project:"📍", system:"🔔" };
function notificationsHtml(items){
  if(!items.length) return `<div class="card empty"><div class="ic">✅</div>All caught up — no notifications.</div>`;
  return `<div class="card card-pad">${items.map(n=>`
    <div class="list-item" style="cursor:pointer;background:${n.read?'transparent':'var(--blue-light)'};border-radius:10px;padding-left:10px;" data-action="mark-read" data-id="${n.id}">
      <div style="font-size:20px;">${NOTIF_ICONS[n.type]||"🔔"}</div>
      <div style="flex:1;">
        <b style="font-size:13.5px;">${esc(n.title)}</b>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">${esc(n.message)}</div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:4px;">${fmtDate(n.date)}</div>
      </div>
    </div>`).join("")}</div>`;
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title, body, footer){
  const existing = document.getElementById("modal-root");
  if(existing) existing.remove();
  const wrap = document.createElement("div");
  wrap.id = "modal-root";
  wrap.className = "modal-overlay";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-header"><b style="font-size:16px;">${title}</b><button class="icon-btn" data-action="close-modal" style="width:30px;height:30px;">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer? `<div class="modal-footer">${footer}</div>`:""}
  </div>`;
  wrap.addEventListener("click", e=>{ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
}
function closeModal(){ const m=document.getElementById("modal-root"); if(m) m.remove(); }

/* ============================================================
   ROUTER
   ============================================================ */
const LOADERS = {
  dashboard: loadDashboard, book: loadBook, projects: loadProjects,
  invoices: loadInvoices, documents: loadDocuments, support: loadSupport,
  chat: loadChat, notifications: loadNotifications, profile: loadProfile,
};
function render(){
  if(state.chatPoll){ clearInterval(state.chatPoll); state.chatPoll=null; }
  if(!state.token || !state.user){ renderAuth(); return; }
  const loader = LOADERS[state.view] || loadDashboard;
  loader();
}

/* ============================================================

   ============================================================ */
document.addEventListener("click", async (e)=>{

  if(!t) return;
  const action = t.dataset.action;

  if(action==="auth-tab"){ state.authMode = t.dataset.mode; renderAuth(); return; }
  if(action==="nav"){ state.view = t.dataset.view; document.getElementById("sidebar")?.classList.remove("open"); render(); return; }
  if(action==="logout"){ logout(); return; }
  if(action==="toggle-theme"){ toggleTheme(); return; }
  if(action==="toggle-sidebar"){ document.getElementById("sidebar").classList.toggle("open"); return; }
  if(action==="close-sidebar"){ document.getElementById("sidebar").classList.remove("open"); return; }
  if(action==="close-modal"){ closeModal(); return; }
  if(action==="reload"){ render(); return; }

  if(action==="book-type"){
    document.querySelectorAll(".chip-row .chip").forEach(c=>c.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("requestTypeInput").value = t.dataset.type;

    try{ await api("/api/notifications/"+t.dataset.id+"/read", {method:"PATCH"}); loadNotifications(); }catch{}
    return;
  }

    return;
  }

    if(!confirm("Sign out of all devices? You'll need to log in again here too.")) return;

    return;
  }

    try{
      const { document: doc } = await api("/api/documents/"+t.dataset.id);
      const a = document.createElement("a");
      a.href = "data:"+doc.mimeType+";base64,"+doc.base64Data;
